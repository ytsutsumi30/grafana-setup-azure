name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check API syntax
        working-directory: api
        run: npm run check:syntax

      - name: Run API unit tests
        working-directory: api
        run: npm test

      - name: Audit API dependencies
        working-directory: api
        run: npm run audit

      - name: Build and start Docker stack
        run: docker compose up -d --build

      - name: Wait for local web health
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Run smoke tests
        env:
          BASE: http://localhost:8080
        run: bash tests/smoke/smoke.sh

      - name: Run API and database integration tests
        env:
          BASE: http://localhost:8080
        run: >-
          node --test
          tests/api/contract.test.js
          tests/api/pps-undo.test.js
          tests/integration/inventory-ledger.test.js
          tests/integration/picking-complete-idempotency.test.js
          tests/integration/receiving-qr-identity.test.js
          tests/smoke/console-check.unit.test.js

      - name: Run browser UI tests
        env:
          BASE: http://localhost:8080
        run: node --test tests/ui/*.test.js

      - name: Verify browser console and API responses
        env:
          BASE: http://localhost:8080
        run: node tests/smoke/console-check.js

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v
