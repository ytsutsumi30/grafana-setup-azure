<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生産計画管理</title>

    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="css/tokens.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
    <link href="css/pages/production-plans.css?v=2026071001" rel="stylesheet">
    <script src="js/m365-auth.js?v=202607070030"></script>
</head>
<body data-page="production-plans">
    <!-- ローディングオーバーレイ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light production-plans-spinner" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- ページヘッダー -->
    <div class="page-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="fas fa-calendar-alt me-2"></i>生産計画管理</h1>
                    <p class="mb-0">製品の生産計画管理</p>
                </div>
                <div class="col-auto">
                    <a href="maintenance.html" class="btn btn-light btn-lg">
                        <i class="fas fa-arrow-left me-2"></i>メンテナンスメニューに戻る
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container mb-5">
        <!-- アクションボタン -->
        <div class="row mb-4">
            <div class="col">
                <button class="btn btn-secondary btn-lg" id="createProductionPlanButton" type="button">
                    <i class="fas fa-plus-circle me-2"></i>新規計画登録
                </button>
                <button class="btn btn-outline-secondary btn-lg ms-2" id="refreshProductionPlansButton" type="button">
                    <i class="fas fa-sync-alt me-2"></i>更新
                </button>
            </div>
        </div>

        <!-- 生産計画一覧テーブル -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>生産計画一覧</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>計画ID</th>
                                <th>製品</th>
                                <th>計画数量</th>
                                <th>開始予定日</th>
                                <th>完了予定日</th>
                                <th>ステータス</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="plansTableBody">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-5">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3">データを読み込んでいます...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 生産計画登録・編集モーダル -->
    <div class="modal fade" id="planModal" tabindex="-1" aria-labelledby="planModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="planModalLabel">
                        <i class="fas fa-calendar-alt me-2"></i><span id="modalTitle">新規計画登録</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="planForm">
                        <input type="hidden" id="planDbId">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="planId" class="form-label required-field">計画ID</label>
                                <input type="text" class="form-control" id="planId" maxlength="50" required>
                                <div class="invalid-feedback">計画IDを入力してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="productId" class="form-label required-field">製品</label>
                                <select class="form-select" id="productId" required>
                                    <option value="">製品を選択してください</option>
                                </select>
                                <div class="invalid-feedback">製品を選択してください</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="plannedQuantity" class="form-label required-field">計画数量</label>
                                <input type="number" class="form-control" id="plannedQuantity" min="1" step="1" required>
                                <div class="invalid-feedback">1以上の数量を入力してください</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="plannedStartDate" class="form-label">開始予定日</label>
                                <input type="date" class="form-control" id="plannedStartDate">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="plannedEndDate" class="form-label">完了予定日</label>
                                <input type="date" class="form-control" id="plannedEndDate">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">ステータス</label>
                            <select class="form-select" id="status">
                                <option value="planned">計画</option>
                                <option value="in_progress">進行中</option>
                                <option value="completed">完了</option>
                                <option value="cancelled">キャンセル</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <button type="button" class="btn btn-secondary production-plans-save-button" id="saveProductionPlanButton">
                        <i class="fas fa-save me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>

    <script src="js/pages/production-plans.js?v=2026071001"></script>
</body>
</html>
