<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生産計画管理</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .page-header {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
        }
        .btn-action {
            min-width: 80px;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(108, 117, 125, 0.05);
        }
        .modal-header {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
        }
        .required-field::after {
            content: " *";
            color: #dc3545;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-overlay.active {
            display: flex;
        }
    </style>
</head>
<body>
    <!-- ローディングオーバーレイ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- ページヘッダー -->
    <div class="page-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="fas fa-calendar-alt me-2"></i>生産計画管理</h1>
                    <p class="mb-0">製品の生産計画管理</p>
                </div>
                <div class="col-auto">
                    <a href="maintenance.html" class="btn btn-light btn-lg">
                        <i class="fas fa-arrow-left me-2"></i>メンテナンスメニューに戻る
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container mb-5">
        <!-- アクションボタン -->
        <div class="row mb-4">
            <div class="col">
                <button class="btn btn-secondary btn-lg" data-bs-toggle="modal" data-bs-target="#planModal" onclick="openCreateModal()">
                    <i class="fas fa-plus-circle me-2"></i>新規計画登録
                </button>
                <button class="btn btn-outline-secondary btn-lg ms-2" onclick="loadPlans()">
                    <i class="fas fa-sync-alt me-2"></i>更新
                </button>
            </div>
        </div>

        <!-- 生産計画一覧テーブル -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>生産計画一覧</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>計画ID</th>
                                <th>製品</th>
                                <th>計画数量</th>
                                <th>開始予定日</th>
                                <th>完了予定日</th>
                                <th>ステータス</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="plansTableBody">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-5">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3">データを読み込んでいます...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 生産計画登録・編集モーダル -->
    <div class="modal fade" id="planModal" tabindex="-1" aria-labelledby="planModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="planModalLabel">
                        <i class="fas fa-calendar-alt me-2"></i><span id="modalTitle">新規計画登録</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="planForm">
                        <input type="hidden" id="planDbId">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="planId" class="form-label required-field">計画ID</label>
                                <input type="text" class="form-control" id="planId" maxlength="50" required>
                                <div class="invalid-feedback">計画IDを入力してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="productId" class="form-label required-field">製品</label>
                                <select class="form-select" id="productId" required>
                                    <option value="">製品を選択してください</option>
                                </select>
                                <div class="invalid-feedback">製品を選択してください</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="plannedQuantity" class="form-label required-field">計画数量</label>
                                <input type="number" class="form-control" id="plannedQuantity" min="1" step="1" required>
                                <div class="invalid-feedback">1以上の数量を入力してください</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="plannedStartDate" class="form-label">開始予定日</label>
                                <input type="date" class="form-control" id="plannedStartDate">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="plannedEndDate" class="form-label">完了予定日</label>
                                <input type="date" class="form-control" id="plannedEndDate">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">ステータス</label>
                            <select class="form-select" id="status">
                                <option value="planned">計画</option>
                                <option value="in_progress">進行中</option>
                                <option value="completed">完了</option>
                                <option value="cancelled">キャンセル</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <button type="button" class="btn btn-secondary" style="background-color: #6c757d;" onclick="savePlan()">
                        <i class="fas fa-save me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = '/api';
        let currentEditingId = null;
        let products = [];

        // ページ読み込み時にデータ取得
        document.addEventListener('DOMContentLoaded', async () => {
            await loadProducts();
            await loadPlans();
        });

        // ローディング表示制御
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // 製品マスタ取得
        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE_URL}/products`);
                if (!response.ok) throw new Error('製品一覧の取得に失敗しました');
                products = await response.json();

                // プルダウン更新
                const select = document.getElementById('productId');
                select.innerHTML = '<option value="">製品を選択してください</option>';
                products.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = `${product.product_code} - ${product.product_name}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading products:', error);
                showError('製品一覧の取得に失敗しました');
            }
        }

        // 生産計画一覧取得
        async function loadPlans() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/production-plans`);
                if (!response.ok) throw new Error('生産計画一覧の取得に失敗しました');

                const plans = await response.json();
                renderPlansTable(plans);
            } catch (error) {
                console.error('Error loading plans:', error);
                showError('生産計画一覧の取得に失敗しました');
                document.getElementById('plansTableBody').innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-danger py-5">
                            <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                            <p>${error.message}</p>
                        </td>
                    </tr>
                `;
            } finally {
                hideLoading();
            }
        }

        // テーブル描画
        function renderPlansTable(plans) {
            const tbody = document.getElementById('plansTableBody');

            if (plans.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="fas fa-inbox fa-3x mb-3"></i>
                            <p>生産計画が登録されていません</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = plans.map(plan => {
                const startDate = plan.planned_start_date ? new Date(plan.planned_start_date).toLocaleDateString('ja-JP') : '-';
                const endDate = plan.planned_end_date ? new Date(plan.planned_end_date).toLocaleDateString('ja-JP') : '-';
                const statusBadge = getStatusBadge(plan.status);

                return `
                    <tr>
                        <td><strong>${escapeHtml(plan.plan_id)}</strong></td>
                        <td>${escapeHtml(plan.product_code)}<br><small class="text-muted">${escapeHtml(plan.product_name)}</small></td>
                        <td><strong>${plan.planned_quantity}</strong></td>
                        <td>${startDate}</td>
                        <td>${endDate}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary btn-action me-1" onclick="openEditModal(${plan.id})" title="編集">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger btn-action" onclick="deletePlan(${plan.id}, '${escapeHtml(plan.plan_id)}')" title="削除">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ステータスバッジ
        function getStatusBadge(status) {
            const badges = {
                'planned': '<span class="badge bg-secondary">計画</span>',
                'in_progress': '<span class="badge bg-primary">進行中</span>',
                'completed': '<span class="badge bg-success">完了</span>',
                'cancelled': '<span class="badge bg-danger">キャンセル</span>'
            };
            return badges[status] || `<span class="badge bg-secondary">${status}</span>`;
        }

        // 新規登録モーダルを開く
        function openCreateModal() {
            currentEditingId = null;
            document.getElementById('modalTitle').textContent = '新規計画登録';
            document.getElementById('planForm').reset();
            document.getElementById('planForm').classList.remove('was-validated');
            document.getElementById('planDbId').value = '';
            document.getElementById('status').value = 'planned';

            const modal = new bootstrap.Modal(document.getElementById('planModal'));
            modal.show();
        }

        // 編集モーダルを開く
        async function openEditModal(planId) {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/production-plans/${planId}`);
                if (!response.ok) throw new Error('生産計画情報の取得に失敗しました');

                const plan = await response.json();

                currentEditingId = planId;
                document.getElementById('modalTitle').textContent = '計画編集';
                document.getElementById('planDbId').value = plan.id;
                document.getElementById('planId').value = plan.plan_id;
                document.getElementById('productId').value = plan.product_id || '';
                document.getElementById('plannedQuantity').value = plan.planned_quantity;
                document.getElementById('plannedStartDate').value = plan.planned_start_date || '';
                document.getElementById('plannedEndDate').value = plan.planned_end_date || '';
                document.getElementById('status').value = plan.status || 'planned';

                document.getElementById('planForm').classList.remove('was-validated');

                const modal = new bootstrap.Modal(document.getElementById('planModal'));
                modal.show();
            } catch (error) {
                console.error('Error loading plan:', error);
                showError('生産計画情報の取得に失敗しました');
            } finally {
                hideLoading();
            }
        }

        // 生産計画保存（新規登録・更新）
        async function savePlan() {
            const form = document.getElementById('planForm');

            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const planData = {
                plan_id: document.getElementById('planId').value.trim(),
                product_id: parseInt(document.getElementById('productId').value),
                planned_quantity: parseInt(document.getElementById('plannedQuantity').value),
                planned_start_date: document.getElementById('plannedStartDate').value || null,
                planned_end_date: document.getElementById('plannedEndDate').value || null,
                status: document.getElementById('status').value
            };

            showLoading();
            try {
                const planId = document.getElementById('planDbId').value;
                const url = planId ? `${API_BASE_URL}/production-plans/${planId}` : `${API_BASE_URL}/production-plans`;
                const method = planId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(planData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '保存に失敗しました');
                }

                const savedPlan = await response.json();

                showSuccess(planId ? '生産計画を更新しました' : '生産計画を登録しました');

                // モーダルを閉じる
                const modal = bootstrap.Modal.getInstance(document.getElementById('planModal'));
                modal.hide();

                // 一覧を再読み込み
                await loadPlans();
            } catch (error) {
                console.error('Error saving plan:', error);
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        // 生産計画削除
        async function deletePlan(planId, planIdStr) {
            if (!confirm(`生産計画「${planIdStr}」を削除してもよろしいですか？\n\n※生産実績がある場合は削除できません。`)) {
                return;
            }

            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/production-plans/${planId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '削除に失敗しました');
                }

                showSuccess('生産計画を削除しました');
                await loadPlans();
            } catch (error) {
                console.error('Error deleting plan:', error);
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        // 成功メッセージ表示
        function showSuccess(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-success alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.style.zIndex = '10000';
            alert.innerHTML = `
                <i class="fas fa-check-circle me-2"></i>${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // エラーメッセージ表示
        function showError(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.style.zIndex = '10000';
            alert.innerHTML = `
                <i class="fas fa-exclamation-circle me-2"></i>${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // HTMLエスケープ
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
