<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配送先拠点管理</title>

    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="css/tokens.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
    <link href="css/pages/delivery-locations.css?v=2026071001" rel="stylesheet">
    <script src="js/m365-auth.js?v=202607070030"></script>
</head>
<body data-page="delivery-locations">
    <!-- ローディングオーバーレイ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light delivery-locations-spinner" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- ページヘッダー -->
    <div class="page-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="fas fa-map-marker-alt me-2"></i>配送先拠点管理</h1>
                    <p class="mb-0">配送先の顧客拠点情報管理</p>
                </div>
                <div class="col-auto">
                    <a href="maintenance.html" class="btn btn-light btn-lg">
                        <i class="fas fa-arrow-left me-2"></i>メンテナンスメニューに戻る
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container mb-5">
        <!-- アクションボタン -->
        <div class="row mb-4">
            <div class="col">
                <button class="btn btn-info btn-lg" id="createDeliveryLocationButton" type="button">
                    <i class="fas fa-plus-circle me-2"></i>新規拠点登録
                </button>
                <button class="btn btn-outline-secondary btn-lg ms-2" id="refreshDeliveryLocationsButton" type="button">
                    <i class="fas fa-sync-alt me-2"></i>更新
                </button>
            </div>
        </div>

        <!-- 拠点一覧テーブル -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>拠点一覧</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>拠点コード</th>
                                <th>拠点名</th>
                                <th>住所</th>
                                <th>電話番号</th>
                                <th>担当者</th>
                                <th>配送方法</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="locationsTableBody">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-5">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3">データを読み込んでいます...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 拠点登録・編集モーダル -->
    <div class="modal fade" id="locationModal" tabindex="-1" aria-labelledby="locationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="locationModalLabel">
                        <i class="fas fa-map-marker-alt me-2"></i><span id="modalTitle">新規拠点登録</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="locationForm">
                        <input type="hidden" id="locationId">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="locationCode" class="form-label required-field">拠点コード</label>
                                <input type="text" class="form-control" id="locationCode" maxlength="20" required>
                                <div class="invalid-feedback">拠点コードを入力してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="locationName" class="form-label required-field">拠点名</label>
                                <input type="text" class="form-control" id="locationName" maxlength="255" required>
                                <div class="invalid-feedback">拠点名を入力してください</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">住所</label>
                            <textarea class="form-control" id="address" rows="2" maxlength="500"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">電話番号</label>
                                <input type="tel" class="form-control" id="phone" maxlength="20">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="contactPerson" class="form-label">担当者</label>
                                <input type="text" class="form-control" id="contactPerson" maxlength="100">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="deliveryMethod" class="form-label">配送方法</label>
                            <select class="form-select" id="deliveryMethod">
                                <option value="宅配便">宅配便</option>
                                <option value="チャーター便">チャーター便</option>
                                <option value="直送">直送</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <button type="button" class="btn btn-info" id="saveDeliveryLocationButton">
                        <i class="fas fa-save me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>

    <script src="js/pages/delivery-locations.js?v=2026071001"></script>
</body>
</html>
