<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配送先拠点管理</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .page-header {
            background: linear-gradient(135deg, #17a2b8, #138496);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
        }
        .btn-action {
            min-width: 80px;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(23, 162, 184, 0.05);
        }
        .modal-header {
            background: linear-gradient(135deg, #17a2b8, #138496);
            color: white;
        }
        .required-field::after {
            content: " *";
            color: #dc3545;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-overlay.active {
            display: flex;
        }
    </style>
</head>
<body>
    <!-- ローディングオーバーレイ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- ページヘッダー -->
    <div class="page-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="fas fa-map-marker-alt me-2"></i>配送先拠点管理</h1>
                    <p class="mb-0">配送先の顧客拠点情報管理</p>
                </div>
                <div class="col-auto">
                    <a href="maintenance.html" class="btn btn-light btn-lg">
                        <i class="fas fa-arrow-left me-2"></i>メンテナンスメニューに戻る
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container mb-5">
        <!-- アクションボタン -->
        <div class="row mb-4">
            <div class="col">
                <button class="btn btn-info btn-lg" data-bs-toggle="modal" data-bs-target="#locationModal" onclick="openCreateModal()">
                    <i class="fas fa-plus-circle me-2"></i>新規拠点登録
                </button>
                <button class="btn btn-outline-secondary btn-lg ms-2" onclick="loadLocations()">
                    <i class="fas fa-sync-alt me-2"></i>更新
                </button>
            </div>
        </div>

        <!-- 拠点一覧テーブル -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>拠点一覧</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>拠点コード</th>
                                <th>拠点名</th>
                                <th>住所</th>
                                <th>電話番号</th>
                                <th>担当者</th>
                                <th>配送方法</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="locationsTableBody">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-5">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3">データを読み込んでいます...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 拠点登録・編集モーダル -->
    <div class="modal fade" id="locationModal" tabindex="-1" aria-labelledby="locationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="locationModalLabel">
                        <i class="fas fa-map-marker-alt me-2"></i><span id="modalTitle">新規拠点登録</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="locationForm">
                        <input type="hidden" id="locationId">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="locationCode" class="form-label required-field">拠点コード</label>
                                <input type="text" class="form-control" id="locationCode" maxlength="20" required>
                                <div class="invalid-feedback">拠点コードを入力してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="locationName" class="form-label required-field">拠点名</label>
                                <input type="text" class="form-control" id="locationName" maxlength="255" required>
                                <div class="invalid-feedback">拠点名を入力してください</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">住所</label>
                            <textarea class="form-control" id="address" rows="2" maxlength="500"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">電話番号</label>
                                <input type="tel" class="form-control" id="phone" maxlength="20">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="contactPerson" class="form-label">担当者</label>
                                <input type="text" class="form-control" id="contactPerson" maxlength="100">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="deliveryMethod" class="form-label">配送方法</label>
                            <select class="form-select" id="deliveryMethod">
                                <option value="宅配便">宅配便</option>
                                <option value="チャーター便">チャーター便</option>
                                <option value="直送">直送</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <button type="button" class="btn btn-info" onclick="saveLocation()">
                        <i class="fas fa-save me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = '/api';
        let currentEditingId = null;

        // ページ読み込み時に拠点一覧を取得
        document.addEventListener('DOMContentLoaded', () => {
            loadLocations();
        });

        // ローディング表示制御
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // 拠点一覧取得
        async function loadLocations() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/delivery-locations`);
                if (!response.ok) throw new Error('拠点一覧の取得に失敗しました');

                const locations = await response.json();
                renderLocationsTable(locations);
            } catch (error) {
                console.error('Error loading locations:', error);
                showError('拠点一覧の取得に失敗しました');
                document.getElementById('locationsTableBody').innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-danger py-5">
                            <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                            <p>${error.message}</p>
                        </td>
                    </tr>
                `;
            } finally {
                hideLoading();
            }
        }

        // テーブル描画
        function renderLocationsTable(locations) {
            const tbody = document.getElementById('locationsTableBody');

            if (locations.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="fas fa-inbox fa-3x mb-3"></i>
                            <p>拠点が登録されていません</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = locations.map(location => `
                <tr>
                    <td><strong>${escapeHtml(location.location_code)}</strong></td>
                    <td>${escapeHtml(location.location_name)}</td>
                    <td>${location.address ? escapeHtml(location.address) : '<span class="text-muted">-</span>'}</td>
                    <td>${location.phone ? escapeHtml(location.phone) : '<span class="text-muted">-</span>'}</td>
                    <td>${location.contact_person ? escapeHtml(location.contact_person) : '<span class="text-muted">-</span>'}</td>
                    <td><span class="badge bg-info">${escapeHtml(location.delivery_method || '宅配便')}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary btn-action me-1" onclick="openEditModal(${location.id})" title="編集">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteLocation(${location.id}, '${escapeHtml(location.location_code)}')" title="削除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 新規登録モーダルを開く
        function openCreateModal() {
            currentEditingId = null;
            document.getElementById('modalTitle').textContent = '新規拠点登録';
            document.getElementById('locationForm').reset();
            document.getElementById('locationForm').classList.remove('was-validated');
            document.getElementById('locationId').value = '';
            document.getElementById('deliveryMethod').value = '宅配便';
        }

        // 編集モーダルを開く
        async function openEditModal(locationId) {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/delivery-locations/${locationId}`);
                if (!response.ok) throw new Error('拠点情報の取得に失敗しました');

                const location = await response.json();

                currentEditingId = locationId;
                document.getElementById('modalTitle').textContent = '拠点編集';
                document.getElementById('locationId').value = location.id;
                document.getElementById('locationCode').value = location.location_code;
                document.getElementById('locationName').value = location.location_name;
                document.getElementById('address').value = location.address || '';
                document.getElementById('phone').value = location.phone || '';
                document.getElementById('contactPerson').value = location.contact_person || '';
                document.getElementById('deliveryMethod').value = location.delivery_method || '宅配便';

                document.getElementById('locationForm').classList.remove('was-validated');

                const modal = new bootstrap.Modal(document.getElementById('locationModal'));
                modal.show();
            } catch (error) {
                console.error('Error loading location:', error);
                showError('拠点情報の取得に失敗しました');
            } finally {
                hideLoading();
            }
        }

        // 拠点保存（新規登録・更新）
        async function saveLocation() {
            const form = document.getElementById('locationForm');

            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const locationData = {
                location_code: document.getElementById('locationCode').value.trim(),
                location_name: document.getElementById('locationName').value.trim(),
                address: document.getElementById('address').value.trim() || null,
                phone: document.getElementById('phone').value.trim() || null,
                contact_person: document.getElementById('contactPerson').value.trim() || null,
                delivery_method: document.getElementById('deliveryMethod').value
            };

            showLoading();
            try {
                const locationId = document.getElementById('locationId').value;
                const url = locationId ? `${API_BASE_URL}/delivery-locations/${locationId}` : `${API_BASE_URL}/delivery-locations`;
                const method = locationId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(locationData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '保存に失敗しました');
                }

                const savedLocation = await response.json();

                showSuccess(locationId ? '拠点情報を更新しました' : '拠点を登録しました');

                // モーダルを閉じる
                const modal = bootstrap.Modal.getInstance(document.getElementById('locationModal'));
                modal.hide();

                // 一覧を再読み込み
                await loadLocations();
            } catch (error) {
                console.error('Error saving location:', error);
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        // 拠点削除
        async function deleteLocation(locationId, locationCode) {
            if (!confirm(`拠点「${locationCode}」を削除してもよろしいですか？\n\n※出荷指示で使用されている場合は削除できません。`)) {
                return;
            }

            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/delivery-locations/${locationId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '削除に失敗しました');
                }

                showSuccess('拠点を削除しました');
                await loadLocations();
            } catch (error) {
                console.error('Error deleting location:', error);
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        // 成功メッセージ表示
        function showSuccess(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-success alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.style.zIndex = '10000';
            alert.innerHTML = `
                <i class="fas fa-check-circle me-2"></i>${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // エラーメッセージ表示
        function showError(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.style.zIndex = '10000';
            alert.innerHTML = `
                <i class="fas fa-exclamation-circle me-2"></i>${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // HTMLエスケープ
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
