<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在庫管理</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .page-header {
            background: linear-gradient(135deg, #343a40, #6c757d);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
        }
        .btn-action {
            min-width: 80px;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(52, 58, 64, 0.05);
        }
        .modal-header {
            background: linear-gradient(135deg, #343a40, #6c757d);
            color: white;
        }
        .required-field::after {
            content: " *";
            color: #dc3545;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-overlay.active {
            display: flex;
        }
        .badge-stock {
            font-size: 0.9rem;
            padding: 0.4rem 0.8rem;
        }
        .stock-high {
            color: #28a745;
            font-weight: bold;
        }
        .stock-low {
            color: #ffc107;
            font-weight: bold;
        }
        .stock-out {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- ローディングオーバーレイ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- ページヘッダー -->
    <div class="page-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="fas fa-boxes me-2"></i>在庫管理</h1>
                    <p class="mb-0">製品在庫の確認と調整</p>
                </div>
                <div class="col-auto">
                    <a href="maintenance.html" class="btn btn-light btn-lg">
                        <i class="fas fa-arrow-left me-2"></i>メンテナンスメニューに戻る
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container mb-5">
        <!-- アクションボタン -->
        <div class="row mb-4">
            <div class="col">
                <button class="btn btn-dark btn-lg" onclick="loadInventory()">
                    <i class="fas fa-sync-alt me-2"></i>更新
                </button>
            </div>
        </div>

        <!-- 在庫一覧テーブル -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>在庫一覧</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>製品コード</th>
                                <th>製品名</th>
                                <th>カテゴリー</th>
                                <th>現在庫</th>
                                <th>引当済</th>
                                <th>利用可能</th>
                                <th>ロケーション</th>
                                <th>最終更新</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <tr>
                                <td colspan="9" class="text-center text-muted py-5">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3">データを読み込んでいます...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 在庫調整モーダル -->
    <div class="modal fade" id="inventoryModal" tabindex="-1" aria-labelledby="inventoryModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="inventoryModalLabel">
                        <i class="fas fa-boxes me-2"></i>在庫調整
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-info mb-3">
                        <i class="fas fa-info-circle me-2"></i>
                        在庫数量とロケーションを調整できます。利用可能在庫は自動計算されます。
                    </div>

                    <form id="inventoryForm">
                        <input type="hidden" id="inventoryId">

                        <div class="mb-3">
                            <label class="form-label fw-bold">製品情報</label>
                            <div class="card bg-light">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <strong>製品コード:</strong> <span id="displayProductCode"></span>
                                        </div>
                                        <div class="col-md-6">
                                            <strong>製品名:</strong> <span id="displayProductName"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="currentStock" class="form-label required-field">現在庫</label>
                                <input type="number" class="form-control" id="currentStock" min="0" step="1" required>
                                <div class="invalid-feedback">0以上の整数を入力してください</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="reservedStock" class="form-label required-field">引当済在庫</label>
                                <input type="number" class="form-control" id="reservedStock" min="0" step="1" required>
                                <div class="invalid-feedback">0以上の整数を入力してください</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">利用可能在庫</label>
                                <input type="number" class="form-control bg-light" id="availableStock" readonly>
                                <small class="text-muted">現在庫 - 引当済</small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="location" class="form-label">ロケーション</label>
                            <input type="text" class="form-control" id="location" maxlength="100" placeholder="例: A-1-01">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <button type="button" class="btn btn-dark" onclick="saveInventory()">
                        <i class="fas fa-save me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = '/api';
        let currentEditingId = null;

        // ページ読み込み時に在庫一覧を取得
        document.addEventListener('DOMContentLoaded', () => {
            loadInventory();

            // 在庫数変更時に利用可能在庫を自動計算
            document.getElementById('currentStock').addEventListener('input', calculateAvailableStock);
            document.getElementById('reservedStock').addEventListener('input', calculateAvailableStock);
        });

        // 利用可能在庫計算
        function calculateAvailableStock() {
            const current = parseInt(document.getElementById('currentStock').value) || 0;
            const reserved = parseInt(document.getElementById('reservedStock').value) || 0;
            const available = Math.max(0, current - reserved);
            document.getElementById('availableStock').value = available;
        }

        // ローディング表示制御
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // 在庫一覧取得
        async function loadInventory() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/inventory`);
                if (!response.ok) throw new Error('在庫一覧の取得に失敗しました');

                const inventory = await response.json();
                renderInventoryTable(inventory);
            } catch (error) {
                console.error('Error loading inventory:', error);
                showError('在庫一覧の取得に失敗しました');
                document.getElementById('inventoryTableBody').innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center text-danger py-5">
                            <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                            <p>${error.message}</p>
                        </td>
                    </tr>
                `;
            } finally {
                hideLoading();
            }
        }

        // テーブル描画
        function renderInventoryTable(inventory) {
            const tbody = document.getElementById('inventoryTableBody');

            if (inventory.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center text-muted py-5">
                            <i class="fas fa-inbox fa-3x mb-3"></i>
                            <p>在庫データがありません</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = inventory.map(item => {
                const lastUpdated = item.last_updated ? new Date(item.last_updated).toLocaleString('ja-JP') : '-';
                return `
                    <tr>
                        <td><strong>${escapeHtml(item.product_code)}</strong></td>
                        <td>${escapeHtml(item.product_name)}</td>
                        <td>${item.category ? `<span class="badge bg-info">${escapeHtml(item.category)}</span>` : '<span class="text-muted">-</span>'}</td>
                        <td><span class="${getStockClass(item.current_stock)}">${item.current_stock}</span></td>
                        <td><span class="text-warning">${item.reserved_stock}</span></td>
                        <td><span class="${getStockClass(item.available_stock)}">${item.available_stock}</span></td>
                        <td>${item.location ? escapeHtml(item.location) : '<span class="text-muted">-</span>'}</td>
                        <td><small>${lastUpdated}</small></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary btn-action" onclick="openAdjustModal(${item.id})" title="在庫調整">
                                <i class="fas fa-edit"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 在庫数に応じたクラスを返す
        function getStockClass(stock) {
            if (stock === null || stock === undefined) return '';
            if (stock === 0) return 'stock-out';
            if (stock < 100) return 'stock-low';
            return 'stock-high';
        }

        // 在庫調整モーダルを開く
        async function openAdjustModal(inventoryId) {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/inventory/${inventoryId}`);
                if (!response.ok) throw new Error('在庫情報の取得に失敗しました');

                const inventory = await response.json();

                currentEditingId = inventoryId;
                document.getElementById('inventoryId').value = inventory.id;
                document.getElementById('displayProductCode').textContent = inventory.product_code;
                document.getElementById('displayProductName').textContent = inventory.product_name;
                document.getElementById('currentStock').value = inventory.current_stock;
                document.getElementById('reservedStock').value = inventory.reserved_stock;
                document.getElementById('location').value = inventory.location || '';

                calculateAvailableStock();

                document.getElementById('inventoryForm').classList.remove('was-validated');

                const modal = new bootstrap.Modal(document.getElementById('inventoryModal'));
                modal.show();
            } catch (error) {
                console.error('Error loading inventory:', error);
                showError('在庫情報の取得に失敗しました');
            } finally {
                hideLoading();
            }
        }

        // 在庫保存
        async function saveInventory() {
            const form = document.getElementById('inventoryForm');

            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const inventoryData = {
                current_stock: parseInt(document.getElementById('currentStock').value),
                reserved_stock: parseInt(document.getElementById('reservedStock').value),
                location: document.getElementById('location').value.trim() || null
            };

            // 引当済が現在庫を超えていないかチェック
            if (inventoryData.reserved_stock > inventoryData.current_stock) {
                showError('引当済在庫は現在庫を超えることはできません');
                return;
            }

            showLoading();
            try {
                const inventoryId = document.getElementById('inventoryId').value;
                const response = await fetch(`${API_BASE_URL}/inventory/${inventoryId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(inventoryData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '保存に失敗しました');
                }

                const savedInventory = await response.json();

                showSuccess('在庫情報を更新しました');

                // モーダルを閉じる
                const modal = bootstrap.Modal.getInstance(document.getElementById('inventoryModal'));
                modal.hide();

                // 一覧を再読み込み
                await loadInventory();
            } catch (error) {
                console.error('Error saving inventory:', error);
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        // 成功メッセージ表示
        function showSuccess(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-success alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.style.zIndex = '10000';
            alert.innerHTML = `
                <i class="fas fa-check-circle me-2"></i>${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // エラーメッセージ表示
        function showError(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.style.zIndex = '10000';
            alert.innerHTML = `
                <i class="fas fa-exclamation-circle me-2"></i>${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // HTMLエスケープ
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
