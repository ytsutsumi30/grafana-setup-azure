<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>受注・出荷指示 - 出荷検品システム</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link href="css/tokens.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/pages/sales-shipping.css" rel="stylesheet">
  <script src="js/m365-auth.js?v=202607070030"></script>
</head>
<body data-page="sales-shipping" data-layout="auto">
  <main class="container-fluid px-3 pb-4">
    <section class="app-card card">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-lg-3">
            <label for="salesOrderNo" class="form-label">受注番号</label>
            <input id="salesOrderNo" class="form-control form-control-lg" type="text">
          </div>
          <div class="col-12 col-lg-3">
            <label for="customerName" class="form-label">顧客名</label>
            <input id="customerName" class="form-control form-control-lg" type="text" value="POC 顧客">
          </div>
          <div class="col-12 col-md-6 col-lg-2">
            <label for="requestedShipDate" class="form-label">希望出荷日</label>
            <input id="requestedShipDate" class="form-control form-control-lg" type="date">
          </div>
          <div class="col-8 col-md-4 col-lg-2">
            <label for="salesPriority" class="form-label">優先度</label>
            <select id="salesPriority" class="form-select form-select-lg">
              <option value="normal">通常</option>
              <option value="high">高</option>
              <option value="low">低</option>
            </select>
          </div>
          <div class="col-4 col-md-2 col-lg-2 d-grid">
            <button id="reloadButton" class="btn btn-outline-primary btn-lg" type="button">
              <i class="fas fa-rotate me-1"></i>更新
            </button>
          </div>
        </div>
        <div class="row g-2 align-items-end mt-1">
          <div class="col-12 col-lg-5">
            <label for="salesProduct" class="form-label">品目</label>
            <select id="salesProduct" class="form-select form-select-lg"></select>
          </div>
          <div class="col-8 col-lg-3">
            <label for="salesQuantity" class="form-label">数量</label>
            <input id="salesQuantity" class="form-control form-control-lg" type="number" min="1" step="1" value="1">
          </div>
          <div class="col-4 col-lg-2 d-grid">
            <button id="createSalesOrderButton" class="btn btn-primary btn-lg" type="button">
              <i class="fas fa-file-circle-plus me-1"></i>受注
            </button>
          </div>
          <div class="col-12 col-lg-2 d-grid">
            <a class="btn btn-outline-secondary btn-lg" href="shipping-instructions.html">
              <i class="fas fa-clipboard-list me-1"></i>出荷指示
            </a>
          </div>
        </div>
      </div>
    </section>

    <section class="row g-2 mb-3" id="salesKpis"></section>

    <div class="row g-3">
      <section class="col-12 col-xl-4">
        <div class="app-card card">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0"><i class="fas fa-file-contract me-1"></i>受注</h2>
            <span id="salesOrderCount" class="badge badge-pending">0件</span>
          </div>
          <div id="salesOrderList" class="list-group list-group-flush">
            <div class="text-muted small p-3">読み込み中...</div>
          </div>
        </div>
      </section>

      <section class="col-12 col-xl-8">
        <div id="salesEmpty" class="app-card card">
          <div class="card-body text-center py-5 text-muted">
            <i class="fas fa-clipboard-list fa-2x mb-3"></i>
            <div>受注を選択すると、明細と生成済み出荷指示を表示します。</div>
          </div>
        </div>

        <div id="salesDetail" class="d-none">
          <section class="app-card card">
            <div class="card-body">
              <div class="d-flex flex-wrap gap-2 justify-content-between align-items-start">
                <div>
                  <h2 id="salesTitle" class="h5 mb-1"></h2>
                  <div id="salesMeta" class="text-muted small"></div>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                  <span id="salesStatus" class="status-badge badge-pending">未選択</span>
                  <button id="createShippingButton" class="btn btn-success" type="button">
                    <i class="fas fa-truck-fast me-1"></i>出荷指示生成
                  </button>
                </div>
              </div>
            </div>
          </section>

          <div class="row g-3">
            <section class="col-12 col-lg-7">
              <div class="app-card card">
                <div class="card-header bg-white">
                  <h3 class="h6 mb-0"><i class="fas fa-layer-group me-1"></i>受注明細</h3>
                </div>
                <div id="salesLines" class="list-group list-group-flush"></div>
              </div>
            </section>

            <section class="col-12 col-lg-5">
              <div class="app-card card">
                <div class="card-header bg-white">
                  <h3 class="h6 mb-0"><i class="fas fa-truck-fast me-1"></i>生成済み出荷指示</h3>
                </div>
                <div id="shippingInstructionList" class="list-group list-group-flush"></div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/sales-shipping.js"></script>
</body>
</html>
