<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検品者マスタ管理</title>

    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="css/tokens.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
    <link href="css/pages/inspectors.css?v=2026071001" rel="stylesheet">
    <script src="js/m365-auth.js?v=202607070030"></script>
</head>
<body data-page="inspectors">
    <!-- ローディングオーバーレイ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light inspectors-spinner" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- ページヘッダー -->
    <div class="page-header">
        <div class="container">
            <h1><i class="fas fa-user-check me-2"></i>検品者マスタ管理</h1>
            <p class="mb-0">検品者情報の登録・編集・削除</p>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container mb-5">
        <!-- アクションボタン -->
        <div class="row mb-4">
            <div class="col">
                <button class="btn btn-primary btn-lg" id="createInspectorButton" type="button">
                    <i class="fas fa-plus-circle me-2"></i>新規検品者登録
                </button>
                <button class="btn btn-outline-secondary btn-lg ms-2" id="refreshInspectorsButton" type="button">
                    <i class="fas fa-sync-alt me-2"></i>更新
                </button>
                <a href="maintenance.html" class="btn btn-outline-info btn-lg ms-2">
                    <i class="fas fa-arrow-left me-2"></i>メンテナンス画面に戻る
                </a>
            </div>
        </div>

        <!-- 検品者一覧テーブル -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>検品者一覧</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>検品者コード</th>
                                <th>氏名</th>
                                <th>メール</th>
                                <th>電話番号</th>
                                <th>部署</th>
                                <th>役割</th>
                                <th>状態</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="inspectorsTableBody">
                            <tr>
                                <td colspan="8" class="text-center text-muted py-5">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3">データを読み込んでいます...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 検品者登録・編集モーダル -->
    <div class="modal fade" id="inspectorModal" tabindex="-1" aria-labelledby="inspectorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="inspectorModalLabel">
                        <i class="fas fa-user-check me-2"></i><span id="modalTitle">新規検品者登録</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="inspectorForm">
                        <input type="hidden" id="inspectorId">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="inspectorCode" class="form-label required-field">検品者コード</label>
                                <input type="text" class="form-control" id="inspectorCode" maxlength="20" required>
                                <div class="invalid-feedback">検品者コードを入力してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="inspectorName" class="form-label required-field">氏名</label>
                                <input type="text" class="form-control" id="inspectorName" maxlength="100" required>
                                <div class="invalid-feedback">氏名を入力してください</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">メールアドレス</label>
                                <input type="email" class="form-control" id="email" maxlength="255">
                                <div class="invalid-feedback">有効なメールアドレスを入力してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">電話番号</label>
                                <input type="tel" class="form-control" id="phone" maxlength="20" placeholder="090-1234-5678">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="department" class="form-label">部署</label>
                                <input type="text" class="form-control" id="department" maxlength="100" placeholder="品質管理部">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="role" class="form-label">役割</label>
                                <select class="form-select" id="role">
                                    <option value="inspector">検品者 (inspector)</option>
                                    <option value="supervisor">スーパーバイザー (supervisor)</option>
                                    <option value="admin">管理者 (admin)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="isActive" checked>
                                <label class="form-check-label" for="isActive">
                                    有効
                                </label>
                            </div>
                            <small class="text-muted">無効にすると、この検品者は選択リストに表示されなくなります</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <button type="button" class="btn btn-primary" id="saveInspectorButton">
                        <i class="fas fa-save me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>

    <script src="js/pages/inspectors.js?v=2026071001"></script>
</body>
</html>
