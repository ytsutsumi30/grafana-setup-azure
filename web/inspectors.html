<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検品者マスタ管理</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .page-header {
            background: linear-gradient(135deg, #20c997, #17a589);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
        }
        .btn-action {
            min-width: 80px;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(32, 201, 151, 0.05);
        }
        .modal-header {
            background: linear-gradient(135deg, #20c997, #17a589);
            color: white;
        }
        .required-field::after {
            content: " *";
            color: #dc3545;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-overlay.active {
            display: flex;
        }
        .badge-role {
            font-size: 0.85rem;
            padding: 0.35rem 0.65rem;
        }
    </style>
</head>
<body>
    <!-- ローディングオーバーレイ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- ページヘッダー -->
    <div class="page-header">
        <div class="container">
            <h1><i class="fas fa-user-check me-2"></i>検品者マスタ管理</h1>
            <p class="mb-0">検品者情報の登録・編集・削除</p>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container mb-5">
        <!-- アクションボタン -->
        <div class="row mb-4">
            <div class="col">
                <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#inspectorModal" onclick="openCreateModal()">
                    <i class="fas fa-plus-circle me-2"></i>新規検品者登録
                </button>
                <button class="btn btn-outline-secondary btn-lg ms-2" onclick="loadInspectors()">
                    <i class="fas fa-sync-alt me-2"></i>更新
                </button>
                <a href="maintenance.html" class="btn btn-outline-info btn-lg ms-2">
                    <i class="fas fa-arrow-left me-2"></i>メンテナンス画面に戻る
                </a>
            </div>
        </div>

        <!-- 検品者一覧テーブル -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>検品者一覧</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>検品者コード</th>
                                <th>氏名</th>
                                <th>メール</th>
                                <th>電話番号</th>
                                <th>部署</th>
                                <th>役割</th>
                                <th>状態</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="inspectorsTableBody">
                            <tr>
                                <td colspan="8" class="text-center text-muted py-5">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3">データを読み込んでいます...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 検品者登録・編集モーダル -->
    <div class="modal fade" id="inspectorModal" tabindex="-1" aria-labelledby="inspectorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="inspectorModalLabel">
                        <i class="fas fa-user-check me-2"></i><span id="modalTitle">新規検品者登録</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="inspectorForm">
                        <input type="hidden" id="inspectorId">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="inspectorCode" class="form-label required-field">検品者コード</label>
                                <input type="text" class="form-control" id="inspectorCode" maxlength="20" required>
                                <div class="invalid-feedback">検品者コードを入力してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="inspectorName" class="form-label required-field">氏名</label>
                                <input type="text" class="form-control" id="inspectorName" maxlength="100" required>
                                <div class="invalid-feedback">氏名を入力してください</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">メールアドレス</label>
                                <input type="email" class="form-control" id="email" maxlength="255">
                                <div class="invalid-feedback">有効なメールアドレスを入力してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">電話番号</label>
                                <input type="tel" class="form-control" id="phone" maxlength="20" placeholder="090-1234-5678">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="department" class="form-label">部署</label>
                                <input type="text" class="form-control" id="department" maxlength="100" placeholder="品質管理部">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="role" class="form-label">役割</label>
                                <select class="form-select" id="role">
                                    <option value="inspector">検品者 (inspector)</option>
                                    <option value="supervisor">スーパーバイザー (supervisor)</option>
                                    <option value="admin">管理者 (admin)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="isActive" checked>
                                <label class="form-check-label" for="isActive">
                                    有効
                                </label>
                            </div>
                            <small class="text-muted">無効にすると、この検品者は選択リストに表示されなくなります</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <button type="button" class="btn btn-primary" onclick="saveInspector()">
                        <i class="fas fa-save me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = '/api';
        let currentEditingId = null;

        // ページ読み込み時に検品者一覧を取得
        document.addEventListener('DOMContentLoaded', () => {
            loadInspectors();
        });

        // ローディング表示制御
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // 検品者一覧取得
        async function loadInspectors() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/inspectors`);
                if (!response.ok) throw new Error('検品者一覧の取得に失敗しました');

                const inspectors = await response.json();
                renderInspectorsTable(inspectors);
            } catch (error) {
                console.error('Error loading inspectors:', error);
                showError('検品者一覧の取得に失敗しました');
                document.getElementById('inspectorsTableBody').innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center text-danger py-5">
                            <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                            <p>${error.message}</p>
                        </td>
                    </tr>
                `;
            } finally {
                hideLoading();
            }
        }

        // テーブル描画
        function renderInspectorsTable(inspectors) {
            const tbody = document.getElementById('inspectorsTableBody');

            if (inspectors.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="fas fa-inbox fa-3x mb-3"></i>
                            <p>検品者が登録されていません</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = inspectors.map(inspector => `
                <tr>
                    <td><strong>${escapeHtml(inspector.inspector_code)}</strong></td>
                    <td>${escapeHtml(inspector.inspector_name)}</td>
                    <td>${inspector.email ? escapeHtml(inspector.email) : '<span class="text-muted">-</span>'}</td>
                    <td>${inspector.phone ? escapeHtml(inspector.phone) : '<span class="text-muted">-</span>'}</td>
                    <td>${inspector.department ? escapeHtml(inspector.department) : '<span class="text-muted">-</span>'}</td>
                    <td><span class="badge badge-role ${getRoleBadgeClass(inspector.role)}">${getRoleLabel(inspector.role)}</span></td>
                    <td>
                        ${inspector.is_active ?
                            '<span class="badge bg-success">有効</span>' :
                            '<span class="badge bg-secondary">無効</span>'}
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary btn-action me-1" onclick="openEditModal(${inspector.id})" title="編集">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteInspector(${inspector.id}, '${escapeHtml(inspector.inspector_code)}')" title="削除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 役割に応じたバッジクラスを返す
        function getRoleBadgeClass(role) {
            switch(role) {
                case 'admin': return 'bg-danger';
                case 'supervisor': return 'bg-warning text-dark';
                case 'inspector': return 'bg-info';
                default: return 'bg-secondary';
            }
        }

        // 役割ラベルを返す
        function getRoleLabel(role) {
            switch(role) {
                case 'admin': return '管理者';
                case 'supervisor': return 'スーパーバイザー';
                case 'inspector': return '検品者';
                default: return role;
            }
        }

        // 新規登録モーダルを開く
        function openCreateModal() {
            currentEditingId = null;
            document.getElementById('modalTitle').textContent = '新規検品者登録';
            document.getElementById('inspectorForm').reset();
            document.getElementById('inspectorForm').classList.remove('was-validated');
            document.getElementById('inspectorId').value = '';
            document.getElementById('isActive').checked = true;
            document.getElementById('role').value = 'inspector';
        }

        // 編集モーダルを開く
        async function openEditModal(inspectorId) {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/inspectors/${inspectorId}`);
                if (!response.ok) throw new Error('検品者情報の取得に失敗しました');

                const inspector = await response.json();

                currentEditingId = inspectorId;
                document.getElementById('modalTitle').textContent = '検品者編集';
                document.getElementById('inspectorId').value = inspector.id;
                document.getElementById('inspectorCode').value = inspector.inspector_code;
                document.getElementById('inspectorName').value = inspector.inspector_name;
                document.getElementById('email').value = inspector.email || '';
                document.getElementById('phone').value = inspector.phone || '';
                document.getElementById('department').value = inspector.department || '';
                document.getElementById('role').value = inspector.role || 'inspector';
                document.getElementById('isActive').checked = inspector.is_active;

                document.getElementById('inspectorForm').classList.remove('was-validated');

                const modal = new bootstrap.Modal(document.getElementById('inspectorModal'));
                modal.show();
            } catch (error) {
                console.error('Error loading inspector:', error);
                showError('検品者情報の取得に失敗しました');
            } finally {
                hideLoading();
            }
        }

        // 検品者保存（新規登録・更新）
        async function saveInspector() {
            const form = document.getElementById('inspectorForm');

            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const inspectorData = {
                inspector_code: document.getElementById('inspectorCode').value.trim(),
                inspector_name: document.getElementById('inspectorName').value.trim(),
                email: document.getElementById('email').value.trim() || null,
                phone: document.getElementById('phone').value.trim() || null,
                department: document.getElementById('department').value.trim() || null,
                role: document.getElementById('role').value,
                is_active: document.getElementById('isActive').checked
            };

            showLoading();
            try {
                const inspectorId = document.getElementById('inspectorId').value;
                const url = inspectorId ? `${API_BASE_URL}/inspectors/${inspectorId}` : `${API_BASE_URL}/inspectors`;
                const method = inspectorId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(inspectorData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '保存に失敗しました');
                }

                const savedInspector = await response.json();

                showSuccess(inspectorId ? '検品者情報を更新しました' : '検品者を登録しました');

                // モーダルを閉じる
                const modal = bootstrap.Modal.getInstance(document.getElementById('inspectorModal'));
                modal.hide();

                // 一覧を再読み込み
                await loadInspectors();
            } catch (error) {
                console.error('Error saving inspector:', error);
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        // 検品者削除
        async function deleteInspector(inspectorId, inspectorCode) {
            if (!confirm(`検品者「${inspectorCode}」を削除してもよろしいですか？\n\n※この検品者が検品記録に紐付いている場合でも削除できます。`)) {
                return;
            }

            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/inspectors/${inspectorId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '削除に失敗しました');
                }

                showSuccess('検品者を削除しました');
                await loadInspectors();
            } catch (error) {
                console.error('Error deleting inspector:', error);
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        // 成功メッセージ表示
        function showSuccess(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-success alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.style.zIndex = '10000';
            alert.innerHTML = `
                <i class="fas fa-check-circle me-2"></i>${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // エラーメッセージ表示
        function showError(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.style.zIndex = '10000';
            alert.innerHTML = `
                <i class="fas fa-exclamation-circle me-2"></i>${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // HTMLエスケープ
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
