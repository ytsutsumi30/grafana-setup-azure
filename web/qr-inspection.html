<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR同梱物検品 - 出荷検品システム</title>

    <!-- バージョン情報 -->
    <meta name="version" content="4.0.0">
    <meta name="build-date" content="2025-11-13">
    <meta name="library" content="html5-qrcode">

    <!-- キャッシュ制御メタタグ（iOS Safari対応） -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .inspection-header {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: white;
            padding: 1.5rem 0;
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .qr-scanner-area {
            border: 2px dashed #0d6efd;
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
            background-color: #000;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .qr-video-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .qr-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
        }
        .qr-item-card {
            border-left: 4px solid #ffc107;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .qr-item-card.scanned {
            border-left-color: #198754;
            background-color: #d1e7dd;
        }
        .qr-status-icon {
            font-size: 1.5rem;
            margin-right: 0.5rem;
        }
        .qr-pending { color: #ffc107; }
        .qr-scanned { color: #198754; }
        .action-buttons {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 1rem;
            border-top: 2px solid #dee2e6;
            box-shadow: 0 -0.5rem 1rem rgba(0,0,0,0.1);
            z-index: 999;
        }
        .progress-card {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border: 2px solid #2196f3;
        }
        .component-type-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }
    </style>
</head>
<body>
    <!-- ヘッダー -->
    <div class="inspection-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col">
                    <h1 class="h4 mb-0">
                        <i class="fas fa-qrcode me-2"></i>QR同梱物検品
                    </h1>
                </div>
                <div class="col-auto">
                    <button class="btn btn-light btn-sm" onclick="window.close()">
                        <i class="fas fa-times me-1"></i>閉じる
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid py-4">
        <!-- 出荷指示情報カード -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm border-primary">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-info-circle me-2"></i>出荷指示情報
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="shipping-info-loading" class="loading-spinner">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">読み込み中...</span>
                            </div>
                        </div>
                        <div id="shipping-info-content" style="display: none;">
                            <div class="row">
                                <div class="col-md-6">
                                    <p><strong>出荷指示番号:</strong> <span id="instruction-id">-</span></p>
                                    <p><strong>製品:</strong> <span id="product-name">-</span> (<span id="product-code">-</span>)</p>
                                    <p><strong>出荷数量:</strong> <span id="shipping-quantity">-</span>個</p>
                                    <p><strong>顧客:</strong> <span id="customer-name">-</span></p>
                                </div>
                                <div class="col-md-6">
                                    <p><strong>配送先:</strong> <span id="delivery-location">-</span></p>
                                    <p><strong>出荷日:</strong> <span id="shipping-date">-</span></p>
                                    <p><strong>優先度:</strong> <span id="priority-badge" class="badge">-</span></p>
                                    <p><strong>特記事項:</strong> <span id="notes">-</span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 左側: QRスキャナーエリア + 在庫情報 -->
            <div class="col-lg-6 mb-4">
                <!-- 在庫情報カード -->
                <div class="card shadow-sm border-info mb-3">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-warehouse me-2"></i>在庫情報
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="inventory-info-loading" class="loading-spinner" style="min-height: 100px;">
                            <div class="spinner-border text-info" role="status">
                                <span class="visually-hidden">読み込み中...</span>
                            </div>
                        </div>
                        <div id="inventory-info-content" style="display: none;">
                            <div class="row text-center">
                                <div class="col-4">
                                    <h4 class="text-primary mb-0" id="current-stock">-</h4>
                                    <small class="text-muted">現在庫</small>
                                </div>
                                <div class="col-4">
                                    <h4 class="text-success mb-0" id="available-stock">-</h4>
                                    <small class="text-muted">利用可能</small>
                                </div>
                                <div class="col-4">
                                    <h4 class="text-warning mb-0" id="predicted-stock">-</h4>
                                    <small class="text-muted">検品後</small>
                                </div>
                            </div>
                            <div id="low-stock-warning" class="alert alert-warning mt-3 mb-0" style="display: none;">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <strong>警告:</strong> 検品後の在庫が不足する可能性があります
                            </div>
                        </div>
                    </div>
                </div>

                <!-- QRスキャナーカード -->
                <div class="card shadow-sm">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0">
                            <i class="fas fa-camera me-2"></i>QRコードスキャン
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- 検品者名入力 -->
                        <div class="mb-3">
                            <label for="qr-inspector-name" class="form-label">
                                <i class="fas fa-user me-1"></i>検品者名 <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="qr-inspector-name"
                                   list="inspector-list"
                                   placeholder="検品者名を入力または選択してください"
                                   maxlength="100"
                                   required>
                            <datalist id="inspector-list">
                                <!-- 検品者リストがここに動的に追加されます -->
                            </datalist>
                            <small class="text-muted">マスタから選択するか、新規の名前を入力できます</small>
                        </div>

                        <!-- スキャナーエリア -->
                        <div id="qr-inspection-content">
                            <!-- QRスキャナーUIがここに動的に生成されます -->
                        </div>

                        <!-- 操作ボタン -->
                        <div class="mt-3 d-grid gap-2">
                            <button type="button" class="btn btn-primary btn-lg" id="btn-start-qr-scan">
                                <i class="fas fa-camera me-2"></i>QRスキャン開始
                            </button>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-outline-secondary" id="btn-manual-input">
                                    <i class="fas fa-keyboard me-1"></i>手動入力
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-test-scan" style="display: none;">
                                    <i class="fas fa-vial me-1"></i>テストスキャン
                                </button>
                            </div>
                        </div>

                        <!-- ステータス表示 -->
                        <div id="qr-status-message" class="mt-3 alert alert-info" style="display: none;">
                            <i class="fas fa-info-circle me-2"></i>
                            <span id="qr-status-text">準備完了</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側: 検品リストと進捗 -->
            <div class="col-lg-6 mb-4">
                <!-- 進捗カード -->
                <div class="card shadow-sm progress-card mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="mb-0">
                                <i class="fas fa-tasks me-2"></i>検品進捗
                            </h5>
                            <span class="badge bg-primary" id="qr-progress-badge">0 / 0</span>
                        </div>
                        <div class="progress" style="height: 25px;">
                            <div id="qr-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
                                 role="progressbar" style="width: 0%">0%</div>
                        </div>
                        <div class="mt-2 text-center">
                            <small class="text-muted" id="qr-progress-label">スキャン待ち</small>
                        </div>
                    </div>
                </div>

                <!-- 検品リスト -->
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-list me-2"></i>検品対象一覧
                        </h5>
                    </div>
                    <div class="card-body" style="max-height: 500px; overflow-y: auto;">
                        <div id="qr-items-list">
                            <!-- 検品アイテムがここに動的に生成されます -->
                            <div class="text-center text-muted py-5">
                                <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                                <p>検品データを読み込み中...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 結果表示エリア -->
                <div id="qr-result-container" class="mt-3" style="display: none;">
                    <!-- 結果がここに表示されます -->
                </div>
            </div>
        </div>
    </div>

    <!-- フッターボタン -->
    <div class="action-buttons">
        <div class="container-fluid">
            <div class="row">
                <div class="col">
                    <button type="button" class="btn btn-secondary" onclick="window.close()">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <small class="text-muted ms-2" id="version-info">
                        v<span id="app-version">-</span>
                        (<span id="build-date">-</span>)
                    </small>
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-success btn-lg" id="btn-complete-qr-inspection" disabled>
                        <i class="fas fa-check me-2"></i>検品完了
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- html5-qrcode ライブラリ（バーコード・QRコード対応） -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <script>
    /**
     * QR同梱物検品システム - 完全API統合版
     * バージョン 4.0.0 (2025-11-13)
     */

    const API_BASE_URL = '/api';

    class QRInspectionSystem {
        constructor() {
            // バージョン情報をメタタグから取得
            this.version = document.querySelector('meta[name="version"]')?.content || 'unknown';
            this.buildDate = document.querySelector('meta[name="build-date"]')?.content || 'unknown';
            this.library = document.querySelector('meta[name="library"]')?.content || 'html5-qrcode';

            // URLパラメータから出荷指示IDを取得
            this.shippingInstructionId = this.getShippingInstructionId();

            if (!this.shippingInstructionId) {
                alert('出荷指示IDが指定されていません。検品システムに戻ります。');
                window.close();
                return;
            }

            // html5-qrcode スキャナー
            this.html5QrCode = null;
            this.isScanning = false;
            this.lastScannedCode = '';
            this.lastScannedTime = 0;
            this.scanDedupDelay = 1000;

            // 検品システム固有プロパティ
            this.inspectorName = '';
            this.scannedItems = new Set();
            this.targetItems = [];
            this.shippingData = null;
            this.inventoryData = null;
            this.qrInspectionId = null;

            this.init();
        }

        getShippingInstructionId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        async init() {
            this.logVersionInfo();
            this.renderVersionInfo();
            this.initElements();
            this.initEventListeners();
            this.initPageLifecycleHandling();

            // データ読み込み
            await Promise.all([
                this.loadShippingInstructionData(),
                this.loadInspectors()
            ]);
        }

        logVersionInfo() {
            console.log('%c╔════════════════════════════════════════════╗', 'color: #00a8ff; font-weight: bold;');
            console.log('%c║  QR同梱物検品システム v4.0.0              ║', 'color: #00a8ff; font-weight: bold;');
            console.log('%c║  完全API統合版                             ║', 'color: #00a8ff; font-weight: bold;');
            console.log('%c╠════════════════════════════════════════════╣', 'color: #00a8ff; font-weight: bold;');
            console.log('%c║  Version:    ' + this.version.padEnd(30) + '║', 'color: #0be881;');
            console.log('%c║  Build Date: ' + this.buildDate.padEnd(30) + '║', 'color: #0be881;');
            console.log('%c║  Library:    ' + this.library.padEnd(30) + '║', 'color: #0be881;');
            console.log('%c║  Shipping ID:' + this.shippingInstructionId.padEnd(30) + '║', 'color: #ffd32a;');
            console.log('%c╚════════════════════════════════════════════╝', 'color: #00a8ff; font-weight: bold;');
        }

        renderVersionInfo() {
            document.getElementById('app-version').textContent = this.version;
            document.getElementById('build-date').textContent = this.buildDate;
        }

        initElements() {
            this.btnStartScan = document.getElementById('btn-start-qr-scan');
            this.btnManualInput = document.getElementById('btn-manual-input');
            this.btnTestScan = document.getElementById('btn-test-scan');
            this.btnComplete = document.getElementById('btn-complete-qr-inspection');

            this.inspectionContent = document.getElementById('qr-inspection-content');
            this.itemsList = document.getElementById('qr-items-list');
            this.statusMessage = document.getElementById('qr-status-message');
            this.statusText = document.getElementById('qr-status-text');
            this.progressBar = document.getElementById('qr-progress-bar');
            this.progressBadge = document.getElementById('qr-progress-badge');
            this.progressLabel = document.getElementById('qr-progress-label');
            this.resultContainer = document.getElementById('qr-result-container');

            this.inspectorNameInput = document.getElementById('qr-inspector-name');
        }

        initEventListeners() {
            this.btnStartScan.addEventListener('click', () => this.handleStartScan());
            this.btnManualInput.addEventListener('click', () => this.handleManualInput());
            this.btnTestScan.addEventListener('click', () => this.handleTestScan());
            this.btnComplete.addEventListener('click', () => this.handleComplete());
        }

        initPageLifecycleHandling() {
            window.addEventListener('beforeunload', () => {
                if (this.html5QrCode && this.isScanning) {
                    try {
                        this.html5QrCode.stop().catch(err => {
                            console.warn('[Cleanup] Stop error:', err);
                        });
                    } catch (error) {
                        console.warn('[Cleanup] Error:', error);
                    }
                }
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && this.isScanning) {
                    console.log('[Visibility] Page hidden - pausing');
                } else if (!document.hidden && this.isScanning) {
                    console.log('[Visibility] Page visible - resuming');
                }
            });
        }

        async loadShippingInstructionData() {
            try {
                const response = await fetch(`${API_BASE_URL}/shipping-instructions/${this.shippingInstructionId}/qr-inspection-data`);

                if (!response.ok) {
                    throw new Error(`出荷指示の取得に失敗しました (HTTP ${response.status})`);
                }

                const data = await response.json();

                this.shippingData = data.shipping;
                this.inventoryData = data.inventory;
                
                // 予測在庫を計算（出荷後の在庫）
                if (this.inventoryData) {
                    this.inventoryData.predicted_stock_after = 
                        this.inventoryData.available_stock - this.shippingData.quantity;
                }
                
                this.targetItems = data.components.map(comp => ({
                    id: comp.id,
                    code: comp.qr_code,
                    name: comp.component_name,
                    type: comp.component_type,
                    required: comp.is_required
                }));

                // 既存の検品レコードがあればIDのみ復元（スキャン状態は復元しない）
                if (data.existingInspection && data.existingInspection.status === 'in_progress') {
                    this.qrInspectionId = data.existingInspection.id;
                }

                this.renderShippingInfo();
                this.renderInventoryInfo();
                this.renderItemsList();
                this.updateProgress();

            } catch (error) {
                console.error('Failed to load shipping instruction data:', error);
                alert('出荷指示データの読み込みに失敗しました。\n' + error.message);
                // エラー時は閉じる
                setTimeout(() => window.close(), 2000);
            }
        }

        async loadInspectors() {
            try {
                // 検品者マスタから有効な検品者を取得
                const response = await fetch(`${API_BASE_URL}/inspectors?is_active=true`);

                if (!response.ok) {
                    throw new Error('検品者リストの取得に失敗しました');
                }

                const inspectors = await response.json();

                const datalist = document.getElementById('inspector-list');
                datalist.innerHTML = inspectors.map(inspector =>
                    `<option value="${inspector.inspector_name}">${inspector.inspector_name} (${inspector.department || '部署なし'})</option>`
                ).join('');

                console.log(`Loaded ${inspectors.length} active inspectors from master data`);

            } catch (error) {
                console.error('Failed to load inspectors:', error);
                // エラー時でも手入力は可能（datalistは空のまま）
                const datalist = document.getElementById('inspector-list');
                if (datalist) {
                    datalist.innerHTML = '';
                }
            }
        }

        renderShippingInfo() {
            if (!this.shippingData) return;

            document.getElementById('shipping-info-loading').style.display = 'none';
            document.getElementById('shipping-info-content').style.display = 'block';

            document.getElementById('instruction-id').textContent = this.shippingData.instruction_id || '未設定';
            document.getElementById('product-name').textContent = this.shippingData.product_name || '未設定';
            document.getElementById('product-code').textContent = this.shippingData.product_code || '未設定';
            document.getElementById('shipping-quantity').textContent = (this.shippingData.quantity || 0).toLocaleString();
            document.getElementById('customer-name').textContent = this.shippingData.customer_name || '未設定';
            document.getElementById('delivery-location').textContent = this.shippingData.delivery_location_name || '未設定';
            document.getElementById('shipping-date').textContent = this.formatDate(this.shippingData.shipping_date);

            const priorityBadge = document.getElementById('priority-badge');
            const priorityMap = {
                'high': { text: '高優先度', class: 'bg-danger' },
                'normal': { text: '通常', class: 'bg-primary' },
                'low': { text: '低優先度', class: 'bg-secondary' }
            };
            const priority = priorityMap[this.shippingData.priority] || priorityMap['normal'];
            priorityBadge.textContent = priority.text;
            priorityBadge.className = `badge ${priority.class}`;

            document.getElementById('notes').textContent = this.shippingData.notes || 'なし';
        }

        renderInventoryInfo() {
            if (!this.inventoryData) {
                document.getElementById('inventory-info-loading').style.display = 'none';
                document.getElementById('inventory-info-content').innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        在庫情報が登録されていません。
                    </div>
                `;
                return;
            }

            document.getElementById('inventory-info-loading').style.display = 'none';
            document.getElementById('inventory-info-content').style.display = 'block';

            document.getElementById('current-stock').textContent = (this.inventoryData.current_stock || 0).toLocaleString();
            document.getElementById('available-stock').textContent = (this.inventoryData.available_stock || 0).toLocaleString();
            document.getElementById('predicted-stock').textContent = (this.inventoryData.predicted_stock_after || 0).toLocaleString();

            const warningElement = document.getElementById('low-stock-warning');
            if ((this.inventoryData.predicted_stock_after || 0) < 10) {
                warningElement.style.display = 'block';
            } else {
                warningElement.style.display = 'none';
            }
        }

        renderItemsList() {
            if (this.targetItems.length === 0) {
                this.itemsList.innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        この製品には同梱物が登録されていません。
                    </div>
                `;
                return;
            }

            const typeLabels = {
                'main': { text: '本体', class: 'bg-primary' },
                'accessory': { text: '付属品', class: 'bg-info' },
                'manual': { text: 'マニュアル', class: 'bg-success' },
                'warranty': { text: '保証書', class: 'bg-warning' }
            };

            this.itemsList.innerHTML = this.targetItems.map(item => {
                const typeInfo = typeLabels[item.type] || { text: item.type, class: 'bg-secondary' };
                return `
                    <div class="card qr-item-card" data-item-code="${item.code}">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <div class="qr-status-icon">
                                    <i class="fas fa-clock qr-pending"></i>
                                </div>
                                <div class="flex-grow-1">
                                    <h6 class="mb-1">
                                        ${item.name}
                                        <span class="badge component-type-badge ${typeInfo.class}">${typeInfo.text}</span>
                                        ${item.required ? '<span class="badge component-type-badge bg-danger">必須</span>' : ''}
                                    </h6>
                                    <small class="text-muted">QRコード: ${item.code}</small>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async handleStartScan() {
            this.inspectorName = this.inspectorNameInput.value;
            if (!this.inspectorName) {
                alert('検品者名を選択してください');
                this.inspectorNameInput.focus();
                return;
            }

            // QR検品セッションを開始（まだ作成していない場合）
            if (!this.qrInspectionId) {
                try {
                    const response = await fetch(`${API_BASE_URL}/qr-inspections`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            shipping_instruction_id: this.shippingInstructionId,
                            inspector_name: this.inspectorName
                        })
                    });

                    if (!response.ok) {
                        throw new Error('QR検品セッションの開始に失敗しました');
                    }

                    const inspection = await response.json();
                    this.qrInspectionId = inspection.id;

                } catch (error) {
                    console.error('Failed to start QR inspection:', error);
                    alert('QR検品セッションの開始に失敗しました。\n' + error.message);
                    return;
                }
            }

            console.log(`[Start] Starting scan for inspector: ${this.inspectorName}, inspection ID: ${this.qrInspectionId}`);

            try {
                await this.startScan();
            } catch (error) {
                this.handleError(error);
            }
        }

        async startScan() {
            if (this.isScanning) {
                console.warn('[Start] Already scanning');
                return;
            }

            this.createCameraUI();

            this.html5QrCode = new Html5Qrcode("qr-reader-container");

            const onScanSuccess = (decodedText, decodedResult) => {
                const currentTime = Date.now();

                if (decodedText === this.lastScannedCode &&
                    currentTime - this.lastScannedTime < this.scanDedupDelay) {
                    return;
                }

                this.lastScannedCode = decodedText;
                this.lastScannedTime = currentTime;

                const codeType = decodedResult.result.format.formatName;
                console.log(`[Scan] Detected ${codeType}:`, decodedText);

                this.handleQRResult(decodedText, codeType);
            };

            const config = {
                fps: 5,
                qrbox: { width: 250, height: 250 },
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.CODE_93,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.ITF,
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.DATA_MATRIX,
                    Html5QrcodeSupportedFormats.AZTEC,
                    Html5QrcodeSupportedFormats.PDF_417
                ]
            };

            try {
                await this.html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess
                );

                this.isScanning = true;
                this.showStatus('スキャン開始しました', 'success');
                console.log('[Start] Scanning started successfully');

                this.btnStartScan.innerHTML = '<i class="fas fa-stop me-2"></i>スキャン停止';
                this.btnStartScan.classList.remove('btn-primary');
                this.btnStartScan.classList.add('btn-danger');
                this.btnStartScan.onclick = () => this.stopScan();

            } catch (error) {
                console.error('[Start] Failed to start scan:', error);
                this.handleError(error);
                this.inspectionContent.innerHTML = '<div class="text-center text-muted py-5"><p>カメラの起動に失敗しました</p></div>';
            }
        }

        createCameraUI() {
            this.inspectionContent.innerHTML = `
                <div id="qr-reader-container" style="width: 100%; border-radius: 0.5rem; overflow: hidden;"></div>
            `;
        }

        async handleQRResult(data, codeType = 'Unknown') {
            if (!this.isScanning) return;

            console.log(`[Scan] Detected ${codeType}:`, data);
            
            // QRコード値を正規化（前後の空白削除、大文字に統一）
            const normalizedData = data.trim().toUpperCase();
            console.log(`[Scan] Normalized:`, normalizedData);

            const item = this.targetItems.find(item => item.code.toUpperCase() === normalizedData);

            if (item) {
                if (this.scannedItems.has(item.code)) {
                    // 既にスキャン済みの場合でもUI更新を実行
                    this.updateItemStatus(item.code, true);
                    this.showStatus(`既にスキャン済みです: ${item.name}`, 'warning');
                    this.playBeep('error');
                } else {
                    // APIにスキャンを記録
                    try {
                        const response = await fetch(`${API_BASE_URL}/qr-inspections/${this.qrInspectionId}/scan`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ qr_code: normalizedData })
                        });

                        const result = await response.json();

                        if (result.success) {
                            this.scannedItems.add(item.code);
                            this.updateItemStatus(item.code, true);
                            this.updateProgress();
                            this.showStatus(`✓ スキャン完了 (${codeType}): ${item.name}`, 'success');
                            this.playBeep('success');

                            // 全てスキャン完了チェック
                            if (this.scannedItems.size === this.targetItems.length) {
                                this.showStatus('全ての検品が完了しました！検品完了ボタンを押してください。', 'success');
                                this.btnComplete.disabled = false;
                            }
                        } else if (result.message && result.message.includes('既にスキャン済み')) {
                            // 重複スキャンの場合でもUIを更新（ページリロード後の継続対応）
                            console.log(`%c[DEBUG] ⚠ Duplicate scan - updating UI anyway`, 'color: #f39c12; font-weight: bold;');
                            this.scannedItems.add(item.code);
                            this.updateItemStatus(item.code, true);
                            this.updateProgress();
                            this.showStatus(`既にスキャン済み: ${item.name}`, 'info');
                            this.playBeep('error');

                            // 全てスキャン完了チェック
                            if (this.scannedItems.size === this.targetItems.length) {
                                setTimeout(() => {
                                    this.stopScan();
                                    this.showStatus('全ての検品が完了しました！検品完了ボタンを押してください。', 'success');
                                    this.btnComplete.disabled = false;
                                }, 1000);
                            }
                        } else {
                            this.showStatus(result.message || 'スキャンの記録に失敗しました', 'danger');
                            this.playBeep('error');
                        }

                    } catch (error) {
                        console.error('Failed to record scan:', error);
                        this.showStatus('スキャンの記録に失敗しました', 'danger');
                        this.playBeep('error');
                    }
                }
            } else {
                this.showStatus(`該当なし (${codeType}): ${normalizedData}`, 'danger');
                this.playBeep('error');
            }
        }

        stopScan() {
            if (!this.isScanning) return;

            console.log('[Stop] Stopping scan...');
            this.isScanning = false;

            if (this.html5QrCode) {
                this.html5QrCode.stop()
                    .then(() => {
                        console.log('[Stop] Scanner stopped successfully');
                        this.html5QrCode = null;
                    })
                    .catch(err => {
                        console.error('[Stop] Error stopping scanner:', err);
                    });
            }

            this.inspectionContent.innerHTML = '<div class="text-center text-muted py-5"><p>スキャナーは停止しました</p></div>';

            this.btnStartScan.innerHTML = '<i class="fas fa-camera me-2"></i>QRスキャン開始';
            this.btnStartScan.classList.remove('btn-danger');
            this.btnStartScan.classList.add('btn-primary');
            this.btnStartScan.onclick = null;
            this.btnStartScan.addEventListener('click', () => this.handleStartScan(), { once: true });

            this.showStatus('スキャンを停止しました', 'info');
        }

        handleError(error) {
            let message = 'カメラにアクセスできませんでした。';

            if (error.name) {
                switch (error.name) {
                    case 'NotAllowedError':
                        message = 'カメラの使用が拒否されました。ブラウザの設定からカメラの許可を有効にしてください。';
                        break;
                    case 'NotFoundError':
                        message = 'カメラが見つかりませんでした。デバイスにカメラが接続されているか確認してください。';
                        break;
                    case 'NotSupportedError':
                        message = 'このブラウザではカメラ機能がサポートされていません。最新のブラウザをご利用ください。';
                        break;
                    case 'NotReadableError':
                        message = 'カメラが他のアプリケーションで使用中です。他のアプリを閉じてから再試行してください。';
                        break;
                    case 'SecurityError':
                        message = 'セキュリティ制限によりカメラにアクセスできません。HTTPS環境が必要です。';
                        break;
                }
            } else if (error.message) {
                message = error.message;
            }

            this.showStatus(message, 'danger');
            console.error('[Error]', error);

            alert(message);
        }

        handleManualInput() {
            const input = prompt('QRコードを手入力してください:');
            if (input && input.trim()) {
                this.handleQRResult(input.trim(), 'Manual');
            }
        }

        handleTestScan() {
            const unscannedItems = this.targetItems.filter(item => !this.scannedItems.has(item.code));
            if (unscannedItems.length > 0) {
                const randomItem = unscannedItems[Math.floor(Math.random() * unscannedItems.length)];
                this.handleQRResult(randomItem.code, 'Test');
            } else {
                this.showStatus('全てスキャン済みです', 'info');
            }
        }

        async handleComplete() {
            const unscanned = this.targetItems.length - this.scannedItems.size;

            if (unscanned > 0) {
                if (!confirm(`未スキャンのアイテムが${unscanned}件あります。検品を完了しますか？`)) {
                    return;
                }
            }

            try {
                const response = await fetch(`${API_BASE_URL}/qr-inspections/${this.qrInspectionId}/complete`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        notes: unscanned > 0 ? `未スキャン: ${unscanned}件` : '全件スキャン完了'
                    })
                });

                if (!response.ok) {
                    throw new Error('検品完了の記録に失敗しました');
                }

                const result = await response.json();

                alert(`検品完了\n検品者: ${this.inspectorName}\nスキャン済み: ${this.scannedItems.size}/${this.targetItems.length}\n在庫更新: 完了`);

                // 完了後は元の画面に戻る
                window.close();

            } catch (error) {
                console.error('Failed to complete inspection:', error);
                alert('検品完了の記録に失敗しました。\n' + error.message);
            }
        }

        showStatus(message, type = 'info') {
            this.statusText.textContent = message;
            this.statusMessage.className = `mt-3 alert alert-${type}`;
            this.statusMessage.style.display = 'block';

            setTimeout(() => {
                this.statusMessage.style.display = 'none';
            }, 3000);
        }

        updateItemStatus(code, scanned) {
            console.log(`[UpdateItemStatus] Looking for item with code: "${code}", scanned: ${scanned}`);
            
            // 大文字小文字を区別しない検索
            const normalizedCode = code.toUpperCase();
            const allCards = Array.from(document.querySelectorAll('[data-item-code]'));
            const itemCard = allCards.find(card => 
                card.getAttribute('data-item-code').toUpperCase() === normalizedCode
            );
            
            console.log(`[UpdateItemStatus] Found item card:`, itemCard);
            
            if (itemCard) {
                if (scanned) {
                    itemCard.classList.add('scanned');
                    const iconElement = itemCard.querySelector('.qr-status-icon');
                    if (iconElement) {
                        iconElement.innerHTML = '<i class="fas fa-check-circle qr-scanned"></i>';
                    }
                    console.log(`[UpdateItemStatus] Updated item "${code}" to scanned`);
                } else {
                    itemCard.classList.remove('scanned');
                    const iconElement = itemCard.querySelector('.qr-status-icon');
                    if (iconElement) {
                        iconElement.innerHTML = '<i class="fas fa-clock qr-pending"></i>';
                    }
                }
            } else {
                console.error(`[UpdateItemStatus] Item card not found for code: "${code}"`);
                console.log('[UpdateItemStatus] Available cards:', 
                    allCards.map(el => el.getAttribute('data-item-code'))
                );
            }
        }

        updateProgress() {
            const total = this.targetItems.length;
            const scanned = this.scannedItems.size;
            const percentage = total > 0 ? Math.round((scanned / total) * 100) : 0;

            this.progressBar.style.width = percentage + '%';
            this.progressBar.textContent = percentage + '%';
            this.progressBadge.textContent = `${scanned} / ${total}`;
            this.progressLabel.textContent = scanned === total ? '検品完了' : `残り ${total - scanned} 件`;

            if (scanned === total) {
                this.progressBar.classList.remove('progress-bar-animated');
                this.progressBar.classList.add('bg-success');
                this.btnComplete.disabled = false;
            }
        }

        formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        playBeep(type = 'success') {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = type === 'success' ? 800 : 400;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } catch (error) {
                console.warn('Audio playback error:', error);
            }
        }
    }

    // アプリケーション初期化
    document.addEventListener('DOMContentLoaded', () => {
        window.qrInspectionApp = new QRInspectionSystem();
    });
    </script>
</body>
