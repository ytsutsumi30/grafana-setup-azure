<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出荷数入力 - 出荷検品システム</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link href="css/tokens.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/pages/shipping-quantity.css?v=2026071001" rel="stylesheet">
</head>
<body data-page="shipping-quantity" data-layout="auto">
  <script src="js/m365-auth.js?v=202607070030"></script>
  <main class="container my-3">
    <div id="instruction-head" class="app-card p-3 mb-3">
      <div class="text-muted">出荷指示を読み込み中…</div>
    </div>
    <div id="workflow-panel" class="app-card workflow-panel p-3 mb-3 d-none"></div>

    <div class="row">
      <!-- 左: 製品(明細)一覧 -->
      <div class="col-lg-5">
        <h5 class="mb-2"><i class="fas fa-box-open me-2"></i>製品(明細)</h5>
        <div id="lines"></div>

        <!-- 製品を追加 -->
        <div class="app-card p-3 mt-2">
          <div class="fw-semibold mb-2 small"><i class="fas fa-plus me-1"></i>製品を追加</div>
          <div class="row g-2 align-items-end">
            <div class="col">
              <label class="form-label small mb-0">製品</label>
              <select id="add-product" class="form-select form-select-sm"><option value="">選択…</option></select>
            </div>
            <div class="col-auto">
              <label class="form-label small mb-0">指示数</label>
              <input id="add-qty" type="number" min="1" class="form-control form-control-sm add-qty-input" placeholder="数量">
            </div>
            <div class="col-auto">
              <button id="btn-add-line" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i></button>
            </div>
          </div>
          <div id="add-line-msg" class="small mt-1"></div>
        </div>
      </div>

      <!-- 右: 選択製品のロット・出荷数入力 -->
      <div class="col-lg-7">
        <div id="lot-panel" class="d-none">
          <h5 class="mb-2"><i class="fas fa-layer-group me-2"></i><span id="panel-product"></span> のロット</h5>

          <div class="app-card p-3 mb-3">
            <div class="d-flex align-items-center gap-2 mb-2">
              <button id="btn-scan" class="btn btn-primary"><i class="fas fa-qrcode me-1"></i>QRでロット選択</button>
              <span class="text-muted small">またはロット一覧から選択</span>
            </div>
            <div id="qr-reader" class="d-none mb-2"></div>
            <div class="row g-2 align-items-end">
              <div class="col-auto">
                <label class="form-label small mb-0">ロット番号</label>
                <input id="lot-number" class="form-control" placeholder="スキャンまたは選択">
              </div>
              <div class="col-auto">
                <label class="form-label small mb-0">出荷数</label>
                <input id="ship-qty" type="number" min="1" class="form-control qty-input" placeholder="数量">
              </div>
              <div class="col-auto">
                <button id="btn-allocate" class="btn btn-success btn-field"><i class="fas fa-check me-1"></i>出荷数を確定</button>
              </div>
            </div>
            <div id="alloc-msg" class="small mt-2"></div>
          </div>

          <h6 class="text-muted">在庫ロット</h6>
          <div class="table-responsive mb-3">
            <table class="table table-sm align-middle">
              <thead><tr><th>ロット番号</th><th class="text-end">在庫</th><th>保管</th><th>期限</th></tr></thead>
              <tbody id="lots-body"></tbody>
            </table>
          </div>

          <h6 class="text-muted">出荷割り当て履歴</h6>
          <div class="table-responsive">
            <table class="table table-sm align-middle">
              <thead><tr><th>ロット</th><th class="text-end">出荷数</th><th>担当</th><th>日時</th><th></th></tr></thead>
              <tbody id="alloc-body"></tbody>
            </table>
          </div>
        </div>
        <div id="lot-empty" class="text-muted p-4 text-center">左の製品を選択してください</div>
      </div>
    </div>
  </main>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="vendor/html5-qrcode/html5-qrcode.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/shipping-quantity.js?v=2026071001"></script>
</body>
</html>
