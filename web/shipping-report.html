<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出荷帳票 - 出荷検品システム</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link href="css/tokens.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/pages/shipping-report.css?v=2026071002" rel="stylesheet">
  <script src="js/m365-auth.js?v=202607070030"></script>
</head>
<body data-page="shipping-report" data-layout="auto">
  <main class="container pb-4">
    <section class="app-card card report-toolbar">
      <div class="card-body d-flex flex-wrap gap-2 justify-content-between align-items-center">
        <div>
          <h2 class="h6 mb-1" id="reportScreenTitle">出荷帳票</h2>
          <div class="text-muted small" id="reportScreenMeta">読み込み中...</div>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <a id="historyLink" class="btn btn-outline-secondary" href="shipping-history.html">
            <i class="fas fa-clock-rotate-left me-1"></i>履歴
          </a>
          <button id="reportPrintButton" class="btn btn-success" type="button">
            <i class="fas fa-print me-1"></i>印刷 / PDF保存
          </button>
        </div>
      </div>
    </section>

    <section id="reportLoading" class="app-card card">
      <div class="card-body text-muted">帳票データを読み込んでいます...</div>
    </section>

    <section id="reportDocument" class="report-document d-none" aria-live="polite"></section>
  </main>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/shipping-report.js?v=2026071001"></script>
</body>
</html>
