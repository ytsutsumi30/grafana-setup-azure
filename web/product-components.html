<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>製品構成部品管理</title>

    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="css/tokens.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
    <link href="css/pages/product-components.css?v=2026071001" rel="stylesheet">
    <script src="js/m365-auth.js?v=202607070030"></script>
</head>
<body data-page="product-components">
    <!-- ローディングオーバーレイ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light product-components-spinner" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- ページヘッダー -->
    <div class="page-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="fas fa-qrcode me-2"></i>製品構成部品管理</h1>
                    <p class="mb-0">製品を構成する部品とQRコード管理</p>
                </div>
                <div class="col-auto">
                    <a href="maintenance.html" class="btn btn-light btn-lg">
                        <i class="fas fa-arrow-left me-2"></i>メンテナンスメニューに戻る
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container mb-5">
        <!-- アクションボタン -->
        <div class="row mb-4">
            <div class="col">
                <button class="btn btn-warning btn-lg" id="createProductComponentButton" type="button">
                    <i class="fas fa-plus-circle me-2"></i>新規部品登録
                </button>
                <button class="btn btn-outline-secondary btn-lg ms-2" id="refreshProductComponentsButton" type="button">
                    <i class="fas fa-sync-alt me-2"></i>更新
                </button>
            </div>
        </div>

        <!-- 部品一覧テーブル -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>部品一覧</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>製品コード</th>
                                <th>製品名</th>
                                <th>部品種別</th>
                                <th>部品名</th>
                                <th>QRコード</th>
                                <th>必須</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="componentsTableBody">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-5">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3">データを読み込んでいます...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 部品登録・編集モーダル -->
    <div class="modal fade" id="componentModal" tabindex="-1" aria-labelledby="componentModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="componentModalLabel">
                        <i class="fas fa-qrcode me-2"></i><span id="modalTitle">新規部品登録</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="componentForm">
                        <input type="hidden" id="componentId">

                        <div class="mb-3">
                            <label for="productId" class="form-label required-field">製品</label>
                            <select class="form-select" id="productId" required>
                                <option value="">製品を選択してください</option>
                            </select>
                            <div class="invalid-feedback">製品を選択してください</div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="componentType" class="form-label required-field">部品種別</label>
                                <select class="form-select" id="componentType" required>
                                    <option value="">選択してください</option>
                                    <option value="main">製品本体</option>
                                    <option value="accessory">付属品</option>
                                    <option value="manual">マニュアル</option>
                                    <option value="warranty">保証書</option>
                                </select>
                                <div class="invalid-feedback">部品種別を選択してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="componentName" class="form-label required-field">部品名</label>
                                <input type="text" class="form-control" id="componentName" maxlength="255" required>
                                <div class="invalid-feedback">部品名を入力してください</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="qrCode" class="form-label required-field">QRコード</label>
                                <input type="text" class="form-control" id="qrCode" maxlength="255" required>
                                <div class="invalid-feedback">QRコードを入力してください</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">必須フラグ</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="isRequired" checked>
                                    <label class="form-check-label" for="isRequired">
                                        必須部品
                                    </label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <button type="button" class="btn btn-warning" id="saveProductComponentButton">
                        <i class="fas fa-save me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>

    <script src="js/pages/product-components.js?v=2026071001"></script>
</body>
</html>
