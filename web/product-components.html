<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>製品構成部品管理</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .page-header {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
        }
        .btn-action {
            min-width: 80px;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(255, 193, 7, 0.05);
        }
        .modal-header {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: white;
        }
        .required-field::after {
            content: " *";
            color: #dc3545;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-overlay.active {
            display: flex;
        }
        .badge-component-type {
            font-size: 0.85rem;
            padding: 0.3rem 0.6rem;
        }
    </style>
</head>
<body>
    <!-- ローディングオーバーレイ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- ページヘッダー -->
    <div class="page-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="fas fa-qrcode me-2"></i>製品構成部品管理</h1>
                    <p class="mb-0">製品を構成する部品とQRコード管理</p>
                </div>
                <div class="col-auto">
                    <a href="maintenance.html" class="btn btn-light btn-lg">
                        <i class="fas fa-arrow-left me-2"></i>メンテナンスメニューに戻る
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container mb-5">
        <!-- アクションボタン -->
        <div class="row mb-4">
            <div class="col">
                <button class="btn btn-warning btn-lg" data-bs-toggle="modal" data-bs-target="#componentModal" onclick="openCreateModal()">
                    <i class="fas fa-plus-circle me-2"></i>新規部品登録
                </button>
                <button class="btn btn-outline-secondary btn-lg ms-2" onclick="loadComponents()">
                    <i class="fas fa-sync-alt me-2"></i>更新
                </button>
            </div>
        </div>

        <!-- 部品一覧テーブル -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>部品一覧</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>製品コード</th>
                                <th>製品名</th>
                                <th>部品種別</th>
                                <th>部品名</th>
                                <th>QRコード</th>
                                <th>必須</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="componentsTableBody">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-5">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3">データを読み込んでいます...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 部品登録・編集モーダル -->
    <div class="modal fade" id="componentModal" tabindex="-1" aria-labelledby="componentModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="componentModalLabel">
                        <i class="fas fa-qrcode me-2"></i><span id="modalTitle">新規部品登録</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="componentForm">
                        <input type="hidden" id="componentId">

                        <div class="mb-3">
                            <label for="productId" class="form-label required-field">製品</label>
                            <select class="form-select" id="productId" required>
                                <option value="">製品を選択してください</option>
                            </select>
                            <div class="invalid-feedback">製品を選択してください</div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="componentType" class="form-label required-field">部品種別</label>
                                <select class="form-select" id="componentType" required>
                                    <option value="">選択してください</option>
                                    <option value="main">製品本体</option>
                                    <option value="accessory">付属品</option>
                                    <option value="manual">マニュアル</option>
                                    <option value="warranty">保証書</option>
                                </select>
                                <div class="invalid-feedback">部品種別を選択してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="componentName" class="form-label required-field">部品名</label>
                                <input type="text" class="form-control" id="componentName" maxlength="255" required>
                                <div class="invalid-feedback">部品名を入力してください</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="qrCode" class="form-label required-field">QRコード</label>
                                <input type="text" class="form-control" id="qrCode" maxlength="255" required>
                                <div class="invalid-feedback">QRコードを入力してください</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">必須フラグ</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="isRequired" checked>
                                    <label class="form-check-label" for="isRequired">
                                        必須部品
                                    </label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <button type="button" class="btn btn-warning" onclick="saveComponent()">
                        <i class="fas fa-save me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = '/api';
        let currentEditingId = null;
        let products = [];

        // ページ読み込み時に部品一覧と製品一覧を取得
        document.addEventListener('DOMContentLoaded', async () => {
            await loadProducts();
            await loadComponents();
        });

        // ローディング表示制御
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // 製品一覧取得
        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE_URL}/products`);
                if (!response.ok) throw new Error('製品一覧の取得に失敗しました');
                products = await response.json();

                // 製品選択プルダウンを更新
                const select = document.getElementById('productId');
                select.innerHTML = '<option value="">製品を選択してください</option>';
                products.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = `${product.product_code} - ${product.product_name}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading products:', error);
                showError('製品一覧の取得に失敗しました');
            }
        }

        // 部品一覧取得
        async function loadComponents() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/product-components`);
                if (!response.ok) throw new Error('部品一覧の取得に失敗しました');

                const components = await response.json();
                renderComponentsTable(components);
            } catch (error) {
                console.error('Error loading components:', error);
                showError('部品一覧の取得に失敗しました');
                document.getElementById('componentsTableBody').innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-danger py-5">
                            <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                            <p>${error.message}</p>
                        </td>
                    </tr>
                `;
            } finally {
                hideLoading();
            }
        }

        // テーブル描画
        function renderComponentsTable(components) {
            const tbody = document.getElementById('componentsTableBody');

            if (components.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="fas fa-inbox fa-3x mb-3"></i>
                            <p>部品が登録されていません</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = components.map(component => {
                const typeBadge = getComponentTypeBadge(component.component_type);
                return `
                    <tr>
                        <td><strong>${escapeHtml(component.product_code)}</strong></td>
                        <td>${escapeHtml(component.product_name)}</td>
                        <td>${typeBadge}</td>
                        <td>${escapeHtml(component.component_name)}</td>
                        <td><code>${escapeHtml(component.qr_code)}</code></td>
                        <td>${component.is_required ? '<span class="badge bg-danger">必須</span>' : '<span class="badge bg-secondary">任意</span>'}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary btn-action me-1" onclick="openEditModal(${component.id})" title="編集">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteComponent(${component.id}, '${escapeHtml(component.component_name)}')" title="削除">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 部品種別バッジ取得
        function getComponentTypeBadge(type) {
            const badges = {
                'main': '<span class="badge badge-component-type bg-primary">製品本体</span>',
                'accessory': '<span class="badge badge-component-type bg-success">付属品</span>',
                'manual': '<span class="badge badge-component-type bg-info">マニュアル</span>',
                'warranty': '<span class="badge badge-component-type bg-warning text-dark">保証書</span>'
            };
            return badges[type] || `<span class="badge badge-component-type bg-secondary">${type}</span>`;
        }

        // 新規登録モーダルを開く
        function openCreateModal() {
            currentEditingId = null;
            document.getElementById('modalTitle').textContent = '新規部品登録';
            document.getElementById('componentForm').reset();
            document.getElementById('componentForm').classList.remove('was-validated');
            document.getElementById('componentId').value = '';
            document.getElementById('isRequired').checked = true;
        }

        // 編集モーダルを開く
        async function openEditModal(componentId) {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/product-components/${componentId}`);
                if (!response.ok) throw new Error('部品情報の取得に失敗しました');

                const component = await response.json();

                currentEditingId = componentId;
                document.getElementById('modalTitle').textContent = '部品編集';
                document.getElementById('componentId').value = component.id;
                document.getElementById('productId').value = component.product_id;
                document.getElementById('componentType').value = component.component_type;
                document.getElementById('componentName').value = component.component_name;
                document.getElementById('qrCode').value = component.qr_code;
                document.getElementById('isRequired').checked = component.is_required;

                document.getElementById('componentForm').classList.remove('was-validated');

                const modal = new bootstrap.Modal(document.getElementById('componentModal'));
                modal.show();
            } catch (error) {
                console.error('Error loading component:', error);
                showError('部品情報の取得に失敗しました');
            } finally {
                hideLoading();
            }
        }

        // 部品保存（新規登録・更新）
        async function saveComponent() {
            const form = document.getElementById('componentForm');

            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const componentData = {
                product_id: parseInt(document.getElementById('productId').value),
                component_type: document.getElementById('componentType').value,
                component_name: document.getElementById('componentName').value.trim(),
                qr_code: document.getElementById('qrCode').value.trim(),
                is_required: document.getElementById('isRequired').checked
            };

            showLoading();
            try {
                const componentId = document.getElementById('componentId').value;
                const url = componentId ? `${API_BASE_URL}/product-components/${componentId}` : `${API_BASE_URL}/product-components`;
                const method = componentId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(componentData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '保存に失敗しました');
                }

                const savedComponent = await response.json();

                showSuccess(componentId ? '部品情報を更新しました' : '部品を登録しました');

                // モーダルを閉じる
                const modal = bootstrap.Modal.getInstance(document.getElementById('componentModal'));
                modal.hide();

                // 一覧を再読み込み
                await loadComponents();
            } catch (error) {
                console.error('Error saving component:', error);
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        // 部品削除
        async function deleteComponent(componentId, componentName) {
            if (!confirm(`部品「${componentName}」を削除してもよろしいですか？\n\n※検品記録で使用されている場合は削除できません。`)) {
                return;
            }

            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/product-components/${componentId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '削除に失敗しました');
                }

                showSuccess('部品を削除しました');
                await loadComponents();
            } catch (error) {
                console.error('Error deleting component:', error);
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        // 成功メッセージ表示
        function showSuccess(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-success alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.style.zIndex = '10000';
            alert.innerHTML = `
                <i class="fas fa-check-circle me-2"></i>${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // エラーメッセージ表示
        function showError(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.style.zIndex = '10000';
            alert.innerHTML = `
                <i class="fas fa-exclamation-circle me-2"></i>${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // HTMLエスケープ
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
