<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - 出荷検品システム</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link href="css/tokens.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { max-width: 420px; width: 100%; }
    .login-head { background: var(--header-gradient); color: #fff; border-radius: var(--radius-card) var(--radius-card) 0 0; padding: 1.5rem; text-align: center; }
    .btn-provider { min-height: var(--touch-target-min); font-weight: 600; }
  </style>
</head>
<body>
  <div class="app-card login-card">
    <div class="login-head">
      <h1 class="h4 mb-1"><i class="fas fa-clipboard-check me-2"></i>出荷検品システム</h1>
      <div class="small opacity-75">サインインしてください</div>
    </div>
    <div class="card-body p-4">
      <div id="providers" class="d-grid gap-2">
        <div class="text-center text-muted py-3">
          <span class="spinner-border spinner-border-sm"></span> 読み込み中…
        </div>
      </div>
      <div id="no-provider" class="alert alert-warning mt-3 d-none">
        ログインプロバイダが未設定です。管理者に連絡してください。
      </div>
    </div>
  </div>

  <script>
    // 遷移先(?redirect=/xxx.html)。既定は index。
    var params = new URLSearchParams(location.search);
    var redirect = params.get('redirect') || '/index.html';
    function loginUrl(p) { return '/api/auth/login/' + p + '?redirect=' + encodeURIComponent(redirect); }

    fetch('/api/auth/whoami', { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (info) {
        if (info.authenticated) { location.href = redirect; return; }
        var box = document.getElementById('providers');
        var html = '';
        if (info.providers && info.providers.microsoft) {
          html += '<a class="btn btn-primary btn-provider" href="' + loginUrl('microsoft') + '">' +
                  '<i class="fab fa-microsoft me-2"></i>Microsoft 365 でログイン</a>';
        }
        if (info.providers && info.providers.google) {
          html += '<a class="btn btn-outline-secondary btn-provider" href="' + loginUrl('google') + '">' +
                  '<i class="fab fa-google me-2"></i>Google でログイン</a>';
        }
        if (!html) {
          box.classList.add('d-none');
          document.getElementById('no-provider').classList.remove('d-none');
        } else {
          box.innerHTML = html;
        }
      })
      .catch(function () {
        document.getElementById('providers').innerHTML =
          '<div class="text-danger text-center">認証状態を取得できませんでした</div>';
      });
  </script>
</body>
</html>
