<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出荷指示マスタメンテナンス - 生産管理システム</title>

    <!-- キャッシュ制御メタタグ（iOS Safari対応） -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .page-header {
            background: linear-gradient(135deg, #0d6efd, #4dabf7);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .card {
            border: none;
            border-radius: 0.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
            margin-bottom: 1.5rem;
        }
        .table-container {
            background: white;
            border-radius: 0.5rem;
            padding: 1.5rem;
        }
        .btn-action {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
        .status-badge {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
        }
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-processing { background-color: #cfe2ff; color: #084298; }
        .status-shipped { background-color: #d1e7dd; color: #0a3622; }
        .status-delivered { background-color: #d3d3d4; color: #141619; }
        .priority-high { background-color: #dc3545; color: white; }
        .priority-normal { background-color: #0dcaf0; color: white; }
        .priority-low { background-color: #6c757d; color: white; }
        .search-box {
            background: white;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .form-label {
            font-weight: 600;
        }
        .required::after {
            content: " *";
            color: #dc3545;
        }
    </style>
</head>
<body>
    <!-- ヘッダー -->
    <div class="page-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col">
                    <h1 class="mb-0">
                        <i class="fas fa-truck-loading me-3"></i>出荷指示マスタメンテナンス
                    </h1>
                    <p class="mb-0 mt-2">Shipping Instruction Master Maintenance</p>
                </div>
                <div class="col-auto">
                    <a class="btn btn-light btn-lg" href="index-org.html">
                        <i class="fas fa-home me-2"></i>ホームに戻る
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <!-- 検索・フィルター -->
        <div class="search-box">
            <div class="row mb-3">
                <div class="col">
                    <h5 class="mb-0">
                        <i class="fas fa-filter me-2"></i>検索・フィルター
                    </h5>
                </div>
                <div class="col-auto">
                    <button class="btn btn-primary" id="btn-new">
                        <i class="fas fa-plus me-2"></i>新規作成
                    </button>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">出荷指示ID</label>
                    <input type="text" class="form-control" id="search-instruction-id" placeholder="SHIP001">
                </div>
                <div class="col-md-2">
                    <label class="form-label">ステータス</label>
                    <select class="form-select" id="search-status">
                        <option value="">すべて</option>
                        <option value="pending">保留中</option>
                        <option value="processing">処理中</option>
                        <option value="shipped">出荷済み</option>
                        <option value="delivered">配達済み</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">優先度</label>
                    <select class="form-select" id="search-priority">
                        <option value="">すべて</option>
                        <option value="high">高</option>
                        <option value="normal">通常</option>
                        <option value="low">低</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">出荷日（開始）</label>
                    <input type="date" class="form-control" id="search-date-from">
                </div>
                <div class="col-md-2">
                    <label class="form-label">出荷日（終了）</label>
                    <input type="date" class="form-control" id="search-date-to">
                </div>
                <div class="col-md-1">
                    <label class="form-label">&nbsp;</label>
                    <button class="btn btn-primary w-100" id="btn-search">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- データテーブル -->
        <div class="table-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">
                    <i class="fas fa-list me-2"></i>出荷指示一覧
                    <span class="badge bg-secondary ms-2" id="total-count">0</span>
                </h5>
                <button class="btn btn-outline-secondary btn-sm" id="btn-refresh">
                    <i class="fas fa-sync-alt me-1"></i>更新
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 100px;">ID</th>
                            <th style="width: 120px;">出荷指示ID</th>
                            <th>製品</th>
                            <th style="width: 80px;">数量</th>
                            <th style="width: 110px;">出荷日</th>
                            <th>出荷場所</th>
                            <th>納入場所</th>
                            <th>顧客名</th>
                            <th style="width: 80px;">優先度</th>
                            <th style="width: 100px;">ステータス</th>
                            <th style="width: 150px;" class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body">
                        <tr>
                            <td colspan="11" class="text-center text-muted py-4">
                                <div class="spinner-border spinner-border-sm me-2" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                データを読み込み中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 編集・新規作成モーダル -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">
                        <i class="fas fa-edit me-2"></i>出荷指示編集
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-form">
                        <input type="hidden" id="edit-id">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label required">出荷指示ID</label>
                                <input type="text" class="form-control" id="edit-instruction-id" required maxlength="50">
                                <div class="invalid-feedback">出荷指示IDを入力してください</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label required">製品</label>
                                <select class="form-select" id="edit-product-id" required>
                                    <option value="">選択してください</option>
                                </select>
                                <div class="invalid-feedback">製品を選択してください</div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label required">数量</label>
                                <input type="number" class="form-control" id="edit-quantity" required min="1">
                                <div class="invalid-feedback">数量を入力してください</div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label required">出荷日</label>
                                <input type="date" class="form-control" id="edit-shipping-date" required>
                                <div class="invalid-feedback">出荷日を選択してください</div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label required">優先度</label>
                                <select class="form-select" id="edit-priority" required>
                                    <option value="normal">通常</option>
                                    <option value="high">高</option>
                                    <option value="low">低</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label required">出荷場所</label>
                                <select class="form-select" id="edit-shipping-location-id" required>
                                    <option value="">選択してください</option>
                                </select>
                                <div class="invalid-feedback">出荷場所を選択してください</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label required">納入場所</label>
                                <select class="form-select" id="edit-delivery-location-id" required>
                                    <option value="">選択してください</option>
                                </select>
                                <div class="invalid-feedback">納入場所を選択してください</div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">顧客名</label>
                                <input type="text" class="form-control" id="edit-customer-name" maxlength="255">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ステータス</label>
                                <select class="form-select" id="edit-status">
                                    <option value="pending">保留中</option>
                                    <option value="processing">処理中</option>
                                    <option value="shipped">出荷済み</option>
                                    <option value="delivered">配達済み</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label class="form-label">追跡番号</label>
                                <input type="text" class="form-control" id="edit-tracking-number" maxlength="100">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">備考</label>
                            <textarea class="form-control" id="edit-notes" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i>キャンセル
                    </button>
                    <button type="button" class="btn btn-primary" id="btn-save">
                        <i class="fas fa-save me-1"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-exclamation-triangle me-2"></i>削除確認
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>以下の出荷指示を削除してもよろしいですか？</p>
                    <div class="alert alert-warning">
                        <strong id="delete-instruction-id"></strong>
                    </div>
                    <p class="text-danger mb-0">
                        <i class="fas fa-info-circle me-1"></i>
                        この操作は取り消せません。
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i>キャンセル
                    </button>
                    <button type="button" class="btn btn-danger" id="btn-delete-confirm">
                        <i class="fas fa-trash me-1"></i>削除する
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shipping-instruction-maintenance.js"></script>
</body>
</html>
