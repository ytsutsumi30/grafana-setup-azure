<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在庫・ロット・QR基盤 - 出荷検品システム</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link href="css/tokens.css?v=2026080104" rel="stylesheet">
  <link href="css/components.css?v=2026080104" rel="stylesheet">
  <link href="css/pages/inventory-foundation.css?v=2026080104" rel="stylesheet">
  <script src="js/m365-auth.js?v=202607070030"></script>
</head>
<body data-page="inventory-foundation" data-layout="auto">
  <main class="container-fluid px-3 pb-4 inventory-workspace">
    <section class="inventory-command-bar" aria-label="在庫検索条件">
      <div class="row g-2 align-items-end">
          <div class="col-12 col-lg-3">
            <label for="inventoryLotFilter" class="form-label">ロット番号</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-box"></i></span>
              <input id="inventoryLotFilter" class="form-control" type="search" placeholder="LOT / RCV / FG" autocomplete="off">
            </div>
          </div>
          <div class="col-12 col-md-5 col-lg-3">
            <label for="inventoryLocationFilter" class="form-label">ロケーション</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-location-dot"></i></span>
              <input id="inventoryLocationFilter" class="form-control" type="search" placeholder="A-1-01" autocomplete="off">
            </div>
          </div>
          <div class="col-12 col-md-7 col-lg-4">
            <span class="form-label d-block">状態</span>
            <div id="inventoryStatusFilters" class="inventory-status-filters" role="group" aria-label="在庫状態">
              <button class="inventory-filter-chip is-active" type="button" data-inventory-status="" aria-pressed="true">すべて</button>
              <button class="inventory-filter-chip" type="button" data-inventory-status="available" aria-pressed="false">利用可能</button>
              <button class="inventory-filter-chip" type="button" data-inventory-status="reserved" aria-pressed="false">引当済</button>
              <button class="inventory-filter-chip" type="button" data-inventory-status="on_hold" aria-pressed="false">保留</button>
              <button class="inventory-filter-chip" type="button" data-inventory-status="defective" aria-pressed="false">不良</button>
            </div>
          </div>
          <div class="col-12 col-lg-2 d-flex gap-2 justify-content-lg-end">
            <button id="inventoryClearFiltersButton" class="btn btn-outline-secondary flex-fill" type="button" title="検索条件を解除">
              <i class="fas fa-filter-circle-xmark me-1"></i>解除
            </button>
            <button id="inventoryReloadButton" class="btn btn-primary flex-fill" type="button">
              <i class="fas fa-rotate me-1"></i><span>更新</span>
            </button>
          </div>
      </div>
    </section>

    <section class="inventory-overview" aria-label="在庫サマリー">
      <div class="inventory-kpi-rail" id="inventoryKpis">
        <div class="inventory-kpi-skeleton" aria-hidden="true"></div>
        <div class="inventory-kpi-skeleton" aria-hidden="true"></div>
        <div class="inventory-kpi-skeleton" aria-hidden="true"></div>
        <div class="inventory-kpi-skeleton" aria-hidden="true"></div>
      </div>
      <div class="inventory-sync-meta" role="status" aria-live="polite">
        <span class="inventory-sync-dot" aria-hidden="true"></span>
        <span id="inventoryLastUpdated">同期中</span>
      </div>
    </section>

    <div class="row g-3">
      <section class="col-12 col-xxl-8">
        <div class="app-card card">
          <div class="card-header inventory-panel-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <h2 class="h6 mb-0"><i class="fas fa-boxes-stacked me-1"></i>在庫残高</h2>
            <div class="d-flex gap-2 align-items-center">
              <span id="inventoryBalanceCount" class="badge badge-pending">0件</span>
            </div>
          </div>
          <div class="table-responsive inventory-table">
            <table class="table table-hover mb-0 inventory-balance-table">
              <thead>
                <tr>
                  <th scope="col"><button class="inventory-sort-button is-active" type="button" data-inventory-sort="product" aria-label="品目で並び替え">品目<i class="fas fa-arrow-up-short-wide"></i></button></th>
                  <th scope="col"><button class="inventory-sort-button" type="button" data-inventory-sort="lot">ロット<i class="fas fa-sort"></i></button></th>
                  <th scope="col">QR</th>
                  <th scope="col"><button class="inventory-sort-button" type="button" data-inventory-sort="location">場所<i class="fas fa-sort"></i></button></th>
                  <th scope="col"><button class="inventory-sort-button" type="button" data-inventory-sort="status">状態<i class="fas fa-sort"></i></button></th>
                  <th scope="col" class="text-end"><button class="inventory-sort-button justify-content-end" type="button" data-inventory-sort="quantity">数量<i class="fas fa-sort"></i></button></th>
                  <th scope="col"><button class="inventory-sort-button" type="button" data-inventory-sort="updated">更新日時<i class="fas fa-sort"></i></button></th>
                </tr>
              </thead>
              <tbody id="inventoryBalanceBody">
                <tr><td colspan="7" class="text-center text-muted py-4">読み込み中...</td></tr>
              </tbody>
            </table>
          </div>
          <div id="inventoryMobileList" class="inventory-mobile-list" aria-live="polite"></div>
        </div>
      </section>

      <section class="col-12 col-xxl-4">
        <div class="app-card card">
          <div class="card-header inventory-panel-header d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0"><i class="fas fa-qrcode me-1"></i>QR単位照会</h2>
            <span id="qrScannerStatus" class="inventory-scanner-status"><i class="fas fa-circle"></i>待機中</span>
          </div>
          <div id="qrScannerPanel" class="card-body inventory-scanner-panel" data-scan-state="idle">
            <label for="qrLookupInput" class="form-label">QRコード</label>
            <div class="input-group inventory-scanner-input-group">
              <span class="input-group-text"><i class="fas fa-barcode"></i></span>
              <input id="qrLookupInput" class="form-control" type="search" placeholder="スキャン / 入力" autocomplete="off" autocapitalize="characters" spellcheck="false">
              <button id="qrLookupButton" class="btn btn-primary btn-field" type="button">
                <i class="fas fa-magnifying-glass me-1"></i><span>照会</span>
              </button>
            </div>
            <div id="qrLookupResult" class="inventory-qr-result" aria-live="polite">
              <div class="inventory-empty-compact"><i class="fas fa-qrcode"></i><span>QRコードを入力してください</span></div>
            </div>
          </div>
        </div>

        <div class="app-card card">
          <div class="card-header inventory-panel-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <h2 class="h6 mb-0"><i class="fas fa-right-left me-1"></i>直近の在庫移動</h2>
            <span id="inventoryTransactionCount" class="badge badge-pending">0件</span>
          </div>
          <div id="inventoryTransactionList" class="inventory-timeline">
            <div class="text-muted small p-3">読み込み中...</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/layout.js?v=2026080104"></script>
  <script src="js/pages/inventory-foundation.js?v=2026080104"></script>
</body>
</html>
