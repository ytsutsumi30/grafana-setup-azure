<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>PPS フロー - 出荷管理システム</title>
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="css/tokens.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .page-header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white; padding: 1.2rem 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .step-badge {
            width: 2.2rem; height: 2.2rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1rem;
        }
        .step-card { border-left: 5px solid #dee2e6; transition: border-color .2s; }
        .step-card.step-active  { border-left-color: var(--color-primary); }
        .step-card.step-done    { border-left-color: var(--color-status-ok); }
        .step-card.step-pending { border-left-color: #6c757d; opacity: .6; }
        .step-card.step-warning { border-left-color: #fd7e14; }

        .flow-arrow { text-align: center; font-size: 1.5rem; color: #adb5bd; margin: .25rem 0; }

        .status-pill {
            font-size: .75rem; padding: .2rem .7rem;
            border-radius: 999px; font-weight: 600;
        }
        .status-pending    { background:#e9ecef; color:#6c757d; }
        .status-picking    { background:#cfe2ff; color:#084298; }
        .status-packing    { background:#fff3cd; color:#664d03; }
        .status-inspecting { background:#d1e7dd; color:#0a3622; }
        .status-shipped    { background:#d0d3d4; color:#2d3436; }
        .status-delivered  { background:#d4edda; color:#155724; }

        .lot-tag {
            display: inline-block; background: #e7f5ff; color: #1971c2;
            border: 1px solid #a5d8ff; border-radius: 4px;
            font-size: .8rem; padding: .1rem .5rem; margin: .1rem;
        }
        .scan-input-area { background: #fff; border-radius: .5rem; padding: 1rem; }
        #scanInput {
            font-size: 1.1rem; letter-spacing: .1em;
            border: 2px solid var(--color-primary);
        }
        .log-item { font-size: .85rem; border-bottom: 1px solid #f0f0f0; padding: .3rem 0; }
        .log-item.err { color: var(--color-status-ng); }
        .log-item.ok  { color: var(--color-status-ok); }
        .log-item.warn { color: #b58100; }
        .scan-feedback {
            animation: scanFlash .45s ease-out;
        }
        .scan-feedback.ok { box-shadow: inset 0 0 0 9999px color-mix(in srgb, var(--color-status-ok), transparent 82%); }
        .scan-feedback.warn { box-shadow: inset 0 0 0 9999px color-mix(in srgb, var(--color-status-pending), transparent 78%); }
        .scan-feedback.err { box-shadow: inset 0 0 0 9999px color-mix(in srgb, var(--color-status-ng), transparent 84%); }
        @keyframes scanFlash {
            from { filter: brightness(1.05); }
            to { filter: brightness(1); }
        }
        .allocation-row {
            display: grid; grid-template-columns: 1fr auto; gap: .5rem;
            border: 1px solid #e9ecef; border-radius: .35rem;
            padding: .4rem .5rem; margin-bottom: .35rem; background: #fff;
        }
        .allocation-row.done { border-color: var(--color-status-ok); background: #f0fff4; }
        .allocation-row .meta { font-size: .78rem; color: #6c757d; }
        .line-progress-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fff;
            padding: .75rem;
            min-height: 100%;
        }
        .line-progress-card.ready { border-color: var(--color-status-ok); }
        .line-progress-card.blocked { border-color: #f59f00; background: #fff9db; }
        .allocation-chip {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            min-height: 32px;
            border: 1px solid #dbe4ff;
            border-radius: 999px;
            background: #edf2ff;
            color: #1c3d8f;
            padding: .2rem .55rem;
            margin: .12rem;
            font-size: .78rem;
            font-weight: 600;
        }
        .allocation-chip.done { border-color: #b2f2bb; background: #ebfbee; color: #087f5b; }
        .allocation-chip.warn { border-color: #ffe066; background: #fff9db; color: #8a5a00; }
        .scan-target-button {
            min-height: 48px;
            text-align: left;
            white-space: normal;
        }
    </style>
    <script src="js/m365-auth.js?v=202607070030"></script>
</head>
<body data-page="pps">

<!-- ヘッダー -->
<div class="page-header">
    <div class="container-fluid px-3">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div>
                    <h5 class="mb-0"><i class="fas fa-boxes me-2"></i>PPS フロー</h5>
                    <small class="opacity-75">PICK → PACK → SHIP</small>
                </div>
            </div>
            <div id="headerStatus"></div>
        </div>
    </div>
</div>

<div class="container-fluid px-3 py-3">
    <!-- 出荷指示選択 -->
    <div class="card mb-3" id="selectCard">
        <div class="card-body">
            <h6 class="card-title mb-2"><i class="fas fa-search me-1"></i>出荷指示を選択</h6>
            <div class="input-group">
                <input type="text" id="siSearch" class="form-control" placeholder="指示番号 / 顧客名で検索">
                <button class="btn btn-primary" onclick="loadSIList()"><i class="fas fa-search"></i></button>
            </div>
            <div id="siList" class="mt-2"></div>
        </div>
    </div>

    <!-- PPS フロー -->
    <div id="ppsFlow" class="d-none">

        <!-- 出荷指示情報 -->
        <div class="card mb-2" id="siInfoCard">
            <div class="card-body py-2 px-3">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <span class="fw-bold" id="infInstructionId"></span>
                        <span class="ms-2" id="infStatus"></span>
                    </div>
                    <button class="btn btn-sm btn-outline-secondary" onclick="resetFlow()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="text-muted small" id="infProduct"></div>
                <div class="text-muted small" id="infCustomer"></div>
            </div>
        </div>

        <div class="card mb-2" id="allocationOverviewCard">
            <div class="card-body py-2 px-3">
                <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
                    <strong><i class="fas fa-list-check me-1"></i>品目・ロット別進捗</strong>
                    <a class="btn btn-outline-primary btn-sm" id="quantityEntryLink" href="#">
                        <i class="fas fa-boxes-stacked me-1"></i>出荷数入力
                    </a>
                </div>
                <div id="allocationOverview"></div>
            </div>
        </div>

        <!-- STEP 1: PICK -->
        <div class="card step-card mb-2" id="stepPick">
            <div class="card-body py-2 px-3">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <div class="step-badge bg-primary text-white">1</div>
                    <strong>PICK　ピッキング</strong>
                    <span id="pickStatus" class="ms-auto status-pill"></span>
                </div>
                <div id="pickContent"></div>
            </div>
        </div>

        <div class="flow-arrow"><i class="fas fa-chevron-down"></i></div>

        <!-- STEP 2: PACK -->
        <div class="card step-card mb-2" id="stepPack">
            <div class="card-body py-2 px-3">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <div class="step-badge bg-warning text-dark">2</div>
                    <strong>PACK　梱包</strong>
                    <span id="packStatus" class="ms-auto status-pill"></span>
                </div>
                <div id="packContent"></div>
            </div>
        </div>

        <div class="flow-arrow"><i class="fas fa-chevron-down"></i></div>

        <!-- STEP 3: SHIP (検品 → 出荷) -->
        <div class="card step-card mb-2" id="stepShip">
            <div class="card-body py-2 px-3">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <div class="step-badge bg-success text-white">3</div>
                    <strong>SHIP　検品 / 出荷</strong>
                    <span id="shipStatus" class="ms-auto status-pill"></span>
                </div>
                <div id="shipContent"></div>
            </div>
        </div>

    </div><!-- /ppsFlow -->
</div><!-- /container -->

<!-- モーダル: ピッキング開始 -->
<div class="modal fade" id="pickStartModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-hand-paper me-2"></i>ピッキング開始</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">担当者名</label>
                    <input type="text" id="pickerName" class="form-control" placeholder="例: 田中太郎">
                </div>
                <div id="availableLots" class="mb-2">
                    <label class="form-label text-muted small">利用可能ロット</label>
                    <div id="lotList" class="d-flex flex-wrap gap-1"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary w-100" onclick="startPicking()">ピッキング指示を作成</button>
            </div>
        </div>
    </div>
</div>

<!-- モーダル: QR スキャン (ピッキング) -->
<div class="modal fade" id="pickScanModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-qrcode me-2"></i>ロット QR スキャン</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="scan-input-area mb-3">
                    <label class="form-label">QR コード / ロット番号</label>
                    <input type="text" id="scanInput" class="form-control" placeholder="ロット番号を入力またはスキャン"
                        autocomplete="off" autofocus>
                    <div class="input-group mt-2">
                        <span class="input-group-text">数量</span>
                        <input type="number" id="scanQty" class="form-control" value="1" min="1">
                        <button class="btn btn-primary" onclick="submitScan()">スキャン</button>
                    </div>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-12 col-md-5">
                        <label class="form-label small mb-1" for="scanNgReason">NG 理由分類</label>
                        <select id="scanNgReason" class="form-select form-select-sm">
                            <option value="">自動判定</option>
                            <option value="unallocated_lot">未引当ロット</option>
                            <option value="wrong_product">別品目</option>
                            <option value="quantity_exceeded">数量超過</option>
                            <option value="duplicate_scan">重複スキャン</option>
                            <option value="lot_not_found">ロット不明</option>
                            <option value="stock_shortage">在庫不足</option>
                            <option value="label_unreadable">ラベル不鮮明</option>
                            <option value="damaged_package">梱包材損傷</option>
                            <option value="other">その他</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-7">
                        <label class="form-label small mb-1" for="scanNgComment">NG コメント</label>
                        <input type="text" id="scanNgComment" class="form-control form-control-sm" maxlength="500" placeholder="NG/警告時のみ任意入力">
                    </div>
                </div>
                <div class="mb-2">
                    <div class="d-flex justify-content-between">
                        <span class="small text-muted">ピッキング進捗</span>
                        <span id="scanProgress" class="small fw-bold"></span>
                    </div>
                    <div class="progress mt-1">
                        <div id="scanProgressBar" class="progress-bar" style="width:0%"></div>
                    </div>
                </div>
                <div id="allocationProgress" class="mb-2"></div>
                <div id="scanTargets" class="row g-2 mb-2"></div>
                <button class="btn btn-outline-warning w-100 mb-2 d-none" id="undoScanBtn" type="button" onclick="undoLastScan()">
                    <i class="fas fa-rotate-left me-1"></i>直前スキャンを取り消す
                </button>
                <div id="scanLog" style="max-height:160px;overflow-y:auto"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success w-100" id="completPickBtn" onclick="completePicking()">
                    <i class="fas fa-check me-1"></i>ピッキング完了
                </button>
            </div>
        </div>
    </div>
</div>

<!-- モーダル: 梱包 -->
<div class="modal fade" id="packModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title"><i class="fas fa-box me-2"></i>梱包記録</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-2">
                    <div class="col-12">
                        <label class="form-label">梱包担当者</label>
                        <input type="text" id="packerName" class="form-control" placeholder="例: 鈴木花子">
                    </div>
                    <div class="col-6">
                        <label class="form-label">梱包数量</label>
                        <input type="number" id="packedQty" class="form-control" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label">箱数</label>
                        <input type="number" id="boxCount" class="form-control" value="1" min="1">
                    </div>
                    <div class="col-6">
                        <label class="form-label">総重量 (kg)</label>
                        <input type="number" id="totalWeight" class="form-control" step="0.1" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label">梱包形態</label>
                        <select id="packagingType" class="form-select">
                            <option value="段ボール">段ボール</option>
                            <option value="パレット">パレット</option>
                            <option value="袋">袋</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">梱包ロット番号（自動）</label>
                        <input type="text" id="packLotNumbers" class="form-control" readonly>
                    </div>
                    <div class="col-12">
                        <label class="form-label">備考</label>
                        <textarea id="packNotes" class="form-control" rows="2"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-warning w-100" onclick="completePacking()">
                    <i class="fas fa-check me-1"></i>梱包完了
                </button>
            </div>
        </div>
    </div>
</div>

<!-- モーダル: 出荷完了後修正 -->
<div class="modal fade" id="postCompletionCorrectionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="fas fa-pen-to-square me-2"></i>出荷完了後修正</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">修正対象ロット</label>
                    <select id="correctionAllocation" class="form-select"></select>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label">修正後ロット番号</label>
                        <input type="text" id="correctionLotNumber" class="form-control" autocomplete="off">
                    </div>
                    <div class="col-6">
                        <label class="form-label">修正後数量</label>
                        <input type="number" id="correctionQuantity" class="form-control" min="1">
                    </div>
                </div>
                <div class="mt-3">
                    <label class="form-label">修正理由</label>
                    <select id="correctionReason" class="form-select">
                        <option value="lot_entry_error">ロット入力誤り</option>
                        <option value="quantity_entry_error">数量入力誤り</option>
                        <option value="customer_request">顧客依頼</option>
                        <option value="inventory_adjustment">在庫調整</option>
                        <option value="other">その他</option>
                    </select>
                </div>
                <div class="mt-3">
                    <label class="form-label">コメント</label>
                    <textarea id="correctionComment" class="form-control" rows="3" placeholder="修正理由の詳細を入力"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success w-100" onclick="submitPostCompletionCorrection()">
                    <i class="fas fa-check me-1"></i>理由付きで修正
                </button>
            </div>
        </div>
    </div>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>
<script>
const API = '';  // same origin

let state = {
    si: null,           // shipping_instruction
    lines: [],          // shipping_instruction_lines
    picking: null,      // picking_instruction
    packing: null,      // packing_record
    qrInspection: null,
    completion: null,
    availableLots: [],
    allocations: [],
    pickingId: null,    // current picking_instruction id
    packingId: null,
    lastScanRecord: null
};

// ===== 出荷指示一覧 =====
async function loadSIList() {
    const q = document.getElementById('siSearch').value.trim();
    const res = await fetch(`${API}/shipping-instructions?status=pending,picking,packing,inspecting,shipped&instruction_id=${encodeURIComponent(q)}`);
    const list = await res.json();
    const el = document.getElementById('siList');
    if (list.length === 0) { el.innerHTML = '<div class="text-muted small py-2">該当する出荷指示がありません</div>'; return; }
    el.innerHTML = list.slice(0,20).map(si => `
        <div class="d-flex justify-content-between align-items-center py-2 border-bottom"
             style="cursor:pointer" onclick="selectSI(${si.id})">
            <div>
                <span class="fw-bold">${si.instruction_id}</span>
                <span class="text-muted small ms-2">${si.product_name || ''} × ${si.quantity}</span><br>
                <span class="text-muted small">${si.customer_name || ''}</span>
            </div>
            <span class="status-pill status-${si.status}">${statusLabel(si.status)}</span>
        </div>
    `).join('');
}

async function selectSI(id) {
    const res = await fetch(`${API}/shipping-instructions/${id}/pps-status`);
    if (!res.ok) { alert('データ取得エラー'); return; }
    const data = await res.json();
    state.si           = data.shipping;
    state.lines        = data.lines || [];
    state.picking      = data.picking;
    state.packing      = data.packing;
    state.qrInspection = data.qr_inspection;
    state.completion   = data.completion;
    state.availableLots= data.available_lots || [];
    state.allocations   = data.allocations || [];
    renderFlow();
    document.getElementById('ppsFlow').classList.remove('d-none');
    document.getElementById('selectCard').classList.add('d-none');
}

function resetFlow() {
    state = { si:null, lines:[], picking:null, packing:null, qrInspection:null, completion:null, availableLots:[], allocations:[], pickingId:null, packingId:null, lastScanRecord:null };
    document.getElementById('ppsFlow').classList.add('d-none');
    document.getElementById('selectCard').classList.remove('d-none');
    document.getElementById('siList').innerHTML = '';
    document.getElementById('siSearch').value = '';
}

// ===== フロー描画 =====
function renderFlow() {
    const si = state.si;
    // ヘッダー
    document.getElementById('infInstructionId').textContent = si.instruction_id;
    document.getElementById('infStatus').innerHTML = `<span class="status-pill status-${si.status}">${statusLabel(si.status)}</span>`;
    document.getElementById('infProduct').innerHTML = renderLineSummary();
    document.getElementById('infCustomer').textContent = `顧客: ${si.customer_name || '-'}  出荷日: ${si.shipping_date || '-'}`;
    document.getElementById('quantityEntryLink').href = `shipping-quantity.html?id=${encodeURIComponent(si.id)}`;
    renderAllocationOverview();

    renderPickStep();
    renderPackStep();
    renderShipStep();
}

function renderPickStep() {
    const p = state.picking;
    const siStatus = state.si.status;
    const card = document.getElementById('stepPick');
    const content = document.getElementById('pickContent');
    const badge = document.getElementById('pickStatus');

    if (!p) {
        const readiness = getQuantityReadiness();
        if (!readiness.ready) {
            card.className = 'card step-card mb-2 step-warning';
            badge.className = 'ms-auto status-pill status-pending';
            badge.textContent = '数量未確定';
            content.innerHTML = `
                <div class="alert alert-warning py-2 mb-2 small">
                    PPS 開始前に、すべての品目でロットと出荷数を確定してください。
                    <div class="mt-1">${escapeHtml(readiness.summary)}</div>
                </div>
                <a class="btn btn-primary btn-sm" href="shipping-quantity.html?id=${encodeURIComponent(state.si.id)}">
                    <i class="fas fa-boxes-stacked me-1"></i>出荷数入力へ
                </a>`;
            return;
        }
        card.className = 'card step-card mb-2 step-active';
        badge.className = 'ms-auto status-pill status-pending';
        badge.textContent = '未開始';
        content.innerHTML = `
            <div class="small text-muted mb-2">確定済みロット引当を照合の正として QR 検品を開始します。</div>
            <button class="btn btn-primary btn-sm" onclick="openPickStart()">
                <i class="fas fa-play me-1"></i>ピッキング指示を作成
            </button>`;
        return;
    }

    const pct = p.total_quantity > 0 ? Math.round(p.picked_quantity / p.total_quantity * 100) : 0;
    if (p.status === 'completed' || isShipmentClosed()) {
        card.className = 'card step-card mb-2 step-done';
        badge.className = 'ms-auto status-pill status-delivered';
        badge.textContent = '完了';
        const lots = (p.records || []).filter(r => r && r.status === 'picked').map(r => `${r.product_code || ''} ${r.lot_number}`.trim());
        const unique = [...new Set(lots)];
        const picked = getTotalPickedQuantity();
        const required = getTotalRequiredQuantity();
        const closedNote = isShipmentClosed()
            ? '<div class="small text-muted mt-1">出荷完了済みのため、通常の直前取消はできません。修正は「完了後修正」から理由付きで記録します。</div>'
            : '';
        content.innerHTML = `
            <div class="small text-muted mb-1">担当: ${p.picker_name || '-'}　QR OK: ${picked}/${required || p.total_quantity}</div>
            <div>${unique.map(l => `<span class="lot-tag">${escapeHtml(l)}</span>`).join('')}</div>
            ${closedNote}`;
    } else {
        card.className = 'card step-card mb-2 step-active';
        badge.className = 'ms-auto status-pill status-picking';
        badge.textContent = '進行中';
        content.innerHTML = `
            <div class="small mb-1">担当: ${p.picker_name || '-'}</div>
            <div class="progress mb-2" style="height:8px">
                <div class="progress-bar" style="width:${pct}%"></div>
            </div>
            <div class="d-flex justify-content-between small text-muted mb-2">

function renderPackStep() {

function renderShipStep() {
    const siStatus = state.si.status;
    const completion = state.completion || {};
    const card = document.getElementById('stepShip');
    const content = document.getElementById('shipContent');
    const badge = document.getElementById('shipStatus');

    if (!['inspecting','shipped','delivered'].includes(siStatus)) {
        card.className = 'card step-card mb-2 step-pending';
        badge.className = 'ms-auto status-pill status-pending';
        badge.textContent = '待機中';
        content.innerHTML = '<div class="text-muted small">梱包完了後に検品 / 出荷ができます</div>';
        return;
    }

    card.className = 'card step-card mb-2 step-active';
    badge.className = `ms-auto status-pill status-${siStatus}`;
    badge.textContent = statusLabel(siStatus);

    if (siStatus === 'inspecting') {
        const blockers = completion.blockers || [];
        const warnings = completion.warnings || [];
        const summary = renderCompletionSummary(completion);
        const blockerHtml = blockers.length
            ? `<div class="alert alert-warning py-2 mb-2 small">${blockers.map(b => `<div>${escapeHtml(b.message)}</div>`).join('')}</div>`
            : '';
        const warningHtml = warnings.length
            ? `<div class="alert alert-info py-2 mb-2 small">${warnings.map(w => `<div>${escapeHtml(w.message)}</div>`).join('')}</div>`
            : '';
        const disabled = completion.can_complete ? '' : 'disabled';
        content.innerHTML = `
            ${summary}
            ${blockerHtml}
            ${warningHtml}
            <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-success btn-sm" ${disabled} onclick="completeShipment()">
                    <i class="fas fa-truck me-1"></i>出荷完了
                </button>
                <button class="btn btn-outline-primary btn-sm" onclick="openPickScan(${state.picking ? state.picking.id : 'null'})" ${state.picking ? '' : 'disabled'}>
                    <i class="fas fa-qrcode me-1"></i>QR 検品履歴
                </button>
                <a href="shipping-history.html?id=${state.si.id}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-clock-rotate-left me-1"></i>履歴
                </a>
            </div>`;
    } else if (siStatus === 'shipped' || siStatus === 'delivered') {
        content.innerHTML = `
            ${renderCompletionSummary(completion)}
            <div class="text-muted small mb-2">出荷済み (${statusLabel(siStatus)})</div>
            <button class="btn btn-outline-success btn-sm" onclick="openPostCompletionCorrection()">
                <i class="fas fa-pen-to-square me-1"></i>完了後修正

function openPickScan(piId) {
    if (!piId) {
        notify('QR 検品対象の PPS 指示がありません。', 'warning');
        return;
    }
    state.pickingId = piId;
    document.getElementById('scanInput').value = '';
    document.getElementById('scanQty').value = 1;
    document.getElementById('scanNgReason').value = '';
    document.getElementById('scanNgComment').value = '';
    document.getElementById('scanLog').innerHTML = '';
    state.lastScanRecord = null;
    const scanLocked = isShipmentClosed() || (state.picking && state.picking.status === 'completed');
    document.getElementById('scanInput').disabled = scanLocked;
    document.getElementById('scanQty').disabled = scanLocked;
    document.getElementById('scanNgReason').disabled = scanLocked;
    document.getElementById('scanNgComment').disabled = scanLocked;
    const submitBtn = document.querySelector('#pickScanModal button[onclick="submitScan()"]');
    if (submitBtn) {
        submitBtn.disabled = scanLocked;

            ? '<i class="fas fa-lock me-2"></i>完了済み'
            : '<i class="fas fa-check me-2"></i>スキャン確定';

function updateScanProgress() {
    const p = state.picking;
    if (!p) return;
    const pct = p.total_quantity > 0 ? Math.round(p.picked_quantity / p.total_quantity * 100) : 0;
    document.getElementById('scanProgress').textContent = `${p.picked_quantity} / ${p.total_quantity}`;
    document.getElementById('scanProgressBar').style.width = `${pct}%`;
    document.getElementById('allocationProgress').innerHTML = renderAllocationProgress();
    renderScanTargets();
    const completeBtn = document.getElementById('completPickBtn');
    if (completeBtn) {
        completeBtn.disabled = p.total_quantity > 0 && Number(p.picked_quantity || 0) < Number(p.total_quantity || 0);
    }
}

async function submitScan() {
    if (isShipmentClosed() || (state.picking && state.picking.status === 'completed')) {
        notify('完了済みの PPS には通常スキャンを追加できません。完了後修正を使用してください。', 'warning');
        return;
    }
    const lot = document.getElementById('scanInput').value.trim();
    const qty = parseInt(document.getElementById('scanQty').value) || 1;
    const ngReason = document.getElementById('scanNgReason').value;
    const ngComment = document.getElementById('scanNgComment').value.trim();
    if (!lot) return;

    const res = await fetch(`${API}/picking-instructions/${state.pickingId}/scan`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            lot_number: lot,
            picked_quantity: qty,
            ng_reason_code: ngReason || null,
            ng_comment: ngComment || null
        })
    });
    const data = await res.json();

    const logEl = document.getElementById('scanLog');
    const isWarn = ['duplicate_scan', 'quantity_exceeded'].includes(data.code);
    const cls = data.success ? 'ok' : (isWarn ? 'warn' : 'err');
    const icon = data.success ? 'OK' : (isWarn ? '警告' : 'NG');
    scanFeedback(cls);
    logEl.innerHTML = `<div class="log-item ${cls}">${icon} ${escapeHtml(lot)}  ×${qty}  ${escapeHtml(data.message || '')}</div>` + logEl.innerHTML;
    notify(data.message || (data.success ? 'QR 検品を記録しました。' : 'QR 検品を記録しました。'), data.success ? 'ok' : (isWarn ? 'info' : 'ng'));

    if (data.success) {
        if (state.picking) {
            state.picking.picked_quantity = data.picked_quantity;
        }
        await refreshState({ keepScanModal: true });
        updateScanProgress();
        document.getElementById('scanInput').value = '';
        document.getElementById('scanQty').value = 1;
        document.getElementById('scanNgReason').value = '';
        document.getElementById('scanNgComment').value = '';
        state.lastScanRecord = data.record || null;
        renderUndoScan();
    } else if (data.remaining_quantity !== undefined && data.remaining_quantity !== null) {
        document.getElementById('scanQty').value = Math.max(1, Number(data.remaining_quantity || 1));
    }
    document.getElementById('scanInput').focus();
}

async function undoLastScan() {
    if (isShipmentClosed() || (state.picking && state.picking.status === 'completed')) {
        notify('完了済みの PPS は直前取消できません。完了後修正を使用してください。', 'warning');
        return;
    }
    if (!state.pickingId || !state.lastScanRecord || !state.lastScanRecord.id) {
        notify('取り消しできる直前スキャンがありません。', 'warning');
        return;
    }
    if (!confirm('直前の OK スキャンを取り消しますか？')) return;
    const recordId = state.lastScanRecord.id;
    const res = await fetch(`${API}/picking-instructions/${state.pickingId}/records/${recordId}`, {
        method: 'DELETE'
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
        notify(data.error || '直前スキャンを取り消せませんでした。', 'ng');
        return;
    }
    scanFeedback('warn');
    notify('直前スキャンを取り消しました。', 'info');
    state.lastScanRecord = null;
    renderUndoScan();
    if (state.picking) {
        state.picking.picked_quantity = data.picked_quantity;
    }
    await refreshState({ keepScanModal: true });
    updateScanProgress();
    document.getElementById('scanLog').innerHTML =
        `<div class="log-item warn">取消 ${escapeHtml(data.cancelled_record?.lot_number || '')} ×${Number(data.cancelled_record?.picked_quantity || 0)}</div>` +
        document.getElementById('scanLog').innerHTML;
}

function renderUndoScan() {
    var btn = document.getElementById('undoScanBtn');
    if (!btn) return;
    const canUndo = !isShipmentClosed()
        && !(state.picking && state.picking.status === 'completed')
        && state.lastScanRecord
        && state.lastScanRecord.id;
    if (canUndo) {
        btn.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-rotate-left me-1"></i>直前スキャンを取り消す';
    } else {
        btn.classList.add('d-none');
        btn.disabled = true;
    }
}

function scanFeedback(kind) {
    var modalBody = document.querySelector('#pickScanModal .modal-content');
    if (modalBody) {
        modalBody.classList.remove('scan-feedback', 'ok', 'warn', 'err');
        void modalBody.offsetWidth;
        modalBody.classList.add('scan-feedback', kind);
        setTimeout(function () { modalBody.classList.remove('scan-feedback', kind); }, 520);
    }
    if (navigator.vibrate) {
        navigator.vibrate(kind === 'ok' ? [80] : kind === 'warn' ? [80, 50, 80] : [120, 80, 120]);
    }
    playScanTone(kind);
}

function playScanTone(kind) {
    try {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        var ctx = new AudioContext();
        var now = ctx.currentTime;
        var tones = kind === 'ok'
            ? [{ f: 880, t: 0, d: 0.08 }]
            : kind === 'warn'
            ? [{ f: 660, t: 0, d: 0.08 }, { f: 660, t: 0.12, d: 0.08 }]
            : [{ f: 220, t: 0, d: 0.1 }, { f: 180, t: 0.14, d: 0.12 }];
        tones.forEach(function (tone) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.frequency.value = tone.f;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.0001, now + tone.t);
            gain.gain.exponentialRampToValueAtTime(0.08, now + tone.t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + tone.t + tone.d);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now + tone.t);
            osc.stop(now + tone.t + tone.d + 0.02);
        });
        setTimeout(function () { ctx.close().catch(function () {}); }, 420);
    } catch (e) {}
}

async function completePicking() {
    if (!confirm('ピッキングを完了しますか？\nロット在庫が減算されます。')) return;
    const res = await fetch(`${API}/picking-instructions/${state.pickingId}/complete`, { method: 'PATCH' });
    if (!res.ok) { const e = await res.json(); alert(e.error); return; }
    bootstrap.Modal.getInstance(document.getElementById('pickScanModal')).hide();
    await refreshState();
}

async function completePacking() {
    const body = {
        shipping_instruction_id: state.si.id,
        picking_instruction_id: state.picking ? state.picking.id : null,
        packer_name: document.getElementById('packerName').value.trim() || null,
        packed_quantity: parseInt(document.getElementById('packedQty').value) || 0,

    });

// ===== 共通 =====
async function refreshState() {
    const res = await fetch(`${API}/shipping-instructions/${state.si.id}/pps-status`);
    const data = await res.json();
    state.si           = data.shipping;
    state.lines        = data.lines || [];
    state.picking      = data.picking;
    state.packing      = data.packing;
    state.qrInspection = data.qr_inspection;
    state.completion   = data.completion;
    state.availableLots= data.available_lots || [];
    state.allocations   = data.allocations || [];
    renderFlow();
    if (arguments[0] && arguments[0].keepScanModal) {
        updateScanProgress();
    }
}

function statusLabel(s) {
    return { pending:'未着手', picking:'ピッキング中', packing:'梱包中',
             inspecting:'検品中', shipped:'出荷済', delivered:'配達済', processing:'処理中' }[s] || s;
}

async function completeShipment() {
    const completion = state.completion || {};
    if (!completion.can_complete) {
        notify('出荷完了条件を満たしていません。未検品数量または未完了作業を確認してください。', 'warning');
        return;
    }
    if (!confirm('確定済みロット引当の全数量を出荷完了にしますか？')) return;
    const res = await fetch(`${API}/shipping-instructions/${state.si.id}/complete-shipment`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ comment: 'PPS 画面から出荷完了' })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
        notify(data.error || '出荷完了に失敗しました。', 'danger');
        return;
    }
    notify('出荷完了を記録しました。', 'success');

}

function openPostCompletionCorrection() {
    const allocations = getActiveAllocations();
    if (!allocations.length) {
        notify('完了後修正できるロット引当がありません。', 'warning');
        return;
    }
    const select = document.getElementById('correctionAllocation');
    select.innerHTML = allocations.map((a) => `
        <option value="${a.id}" data-lot="${escapeHtml(a.lot_number)}" data-qty="${Number(a.shipped_quantity || 0)}">
            ${escapeHtml(a.product_code || '')} ${escapeHtml(a.product_name || '')} / ${escapeHtml(a.lot_number)} / ${Number(a.shipped_quantity || 0)}個
        </option>
    `).join('');
    select.onchange = syncCorrectionFields;
    syncCorrectionFields();
    document.getElementById('correctionReason').value = 'lot_entry_error';
    document.getElementById('correctionComment').value = '';
    new bootstrap.Modal(document.getElementById('postCompletionCorrectionModal')).show();
}

function syncCorrectionFields() {
    const option = document.getElementById('correctionAllocation').selectedOptions[0];
    document.getElementById('correctionLotNumber').value = option ? option.dataset.lot || '' : '';
    document.getElementById('correctionQuantity').value = option ? option.dataset.qty || '' : '';
}

async function submitPostCompletionCorrection() {
    const allocationId = Number(document.getElementById('correctionAllocation').value);
    const lotNumber = document.getElementById('correctionLotNumber').value.trim();
    const shippedQuantity = Number(document.getElementById('correctionQuantity').value);
    const reasonCode = document.getElementById('correctionReason').value;
    const comment = document.getElementById('correctionComment').value.trim();
    if (!allocationId || !lotNumber || !shippedQuantity || shippedQuantity < 1) {
        notify('修正対象、ロット番号、数量を確認してください。', 'warning');
        return;
    }
    if (!comment) {
        notify('完了後修正にはコメント入力が必要です。', 'warning');
        return;
    }
    const res = await fetch(`${API}/shipping-instructions/${state.si.id}/post-completion-corrections`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            allocation_id: allocationId,
            lot_number: lotNumber,
            shipped_quantity: shippedQuantity,
            reason_code: reasonCode,
            comment
        })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
        notify(data.error || '完了後修正に失敗しました。', 'danger');
        return;
    }
    bootstrap.Modal.getInstance(document.getElementById('postCompletionCorrectionModal')).hide();
    notify('完了後修正を監査ログへ記録しました。', 'success');
    await refreshState();
}

function renderLineSummary() {
    if (!state.lines || !state.lines.length) {
        return `${state.si.product_code || ''}  ${state.si.product_name || ''}  × ${state.si.quantity || 0}`;
    }
    const total = state.lines.reduce((sum, l) => sum + Number(l.quantity || 0), 0);
    const allocated = state.lines.reduce((sum, l) => sum + Number(l.allocated_quantity || l.shipped_quantity || 0), 0);
    const picked = getTotalPickedQuantity();
    const progressLabel = isShipmentClosed() ? 'QR OK' : 'QR検品';
    const items = state.lines.map(l => {
        const linePicked = getLinePickedQuantity(l);
        const lineAlloc = l.allocations && l.allocations.length
            ? l.allocations.map(a => `${a.lot_number}:${getAllocationPickedQuantity(a)}/${a.shipped_quantity || 0}`).join(' / ')
            : 'ロット未引当';
        return `<span class="lot-tag">${escapeHtml(l.product_code || '')} ${escapeHtml(l.product_name || '')} 引当 ${Number(l.allocated_quantity || l.shipped_quantity || 0)}/${Number(l.quantity || 0)} ${progressLabel} ${linePicked} (${escapeHtml(lineAlloc)})</span>`;
    }).join('');
    return `<div>${state.lines.length}品目 / 引当 ${allocated}/${total} / ${progressLabel} ${picked}/${allocated || total}</div><div class="mt-1">${items}</div>`;
}

function renderAllocationOverview() {
    const box = document.getElementById('allocationOverview');
    if (!box) return;
    if (!state.lines || !state.lines.length) {
        box.innerHTML = '<div class="text-muted small">品目明細がありません。</div>';
        return;
    }
    box.innerHTML = `
        <div class="row g-2">
            ${state.lines.map(line => {
                const required = Number(line.quantity || 0);
                const allocated = Number(line.allocated_quantity || line.shipped_quantity || 0);
                const picked = getLinePickedQuantity(line);
                const ready = required > 0 && allocated >= required;
                const pickPct = allocated > 0 ? Math.min(100, Math.round(picked / allocated * 100)) : 0;
                const allocPct = required > 0 ? Math.min(100, Math.round(allocated / required * 100)) : 0;
                const chips = (line.allocations || []).length
                    ? line.allocations.map(a => {
                        const aPicked = getAllocationPickedQuantity(a);
                        const aRequired = Number(a.shipped_quantity || 0);
                        const cls = aRequired > 0 && aPicked >= aRequired ? 'done' : (aPicked > 0 ? 'warn' : '');
                        return `<span class="allocation-chip ${cls}">${escapeHtml(a.lot_number)} ${aPicked}/${aRequired}</span>`;
                    }).join('')
                    : '<span class="text-muted small">ロット未引当</span>';
                return `
                    <div class="col-md-6 col-xl-4">
                        <div class="line-progress-card ${ready ? 'ready' : 'blocked'}">
                            <div class="d-flex justify-content-between gap-2">
                                <div>
                                    <div class="fw-semibold">${escapeHtml(line.product_code || '')}</div>
                                    <div class="small text-muted">${escapeHtml(line.product_name || '')}</div>
                                </div>
                                <span class="status-pill ${ready ? 'status-delivered' : 'status-pending'}">${ready ? '数量確定' : '未確定'}</span>
                            </div>
                            <div class="small text-muted mt-2">ロット引当 ${allocated}/${required}</div>
                            <div class="progress mt-1" style="height:7px"><div class="progress-bar" style="width:${allocPct}%"></div></div>
                            <div class="small text-muted mt-2">QR 検品 ${picked}/${allocated || required}</div>
                            <div class="progress mt-1" style="height:7px"><div class="progress-bar bg-success" style="width:${pickPct}%"></div></div>
                            <div class="mt-2">${chips}</div>
                        </div>
                    </div>`;
            }).join('')}
        </div>`;
}

function isShipmentClosed() {
    return ['shipped', 'delivered'].includes(state.si && state.si.status);
}

function getTotalRequiredQuantity() {
    if (!state.lines || !state.lines.length) {
        return Number(state.picking?.total_quantity || state.si?.quantity || 0);
    }
    return state.lines.reduce((sum, line) => sum + Number(line.allocated_quantity || line.shipped_quantity || line.quantity || 0), 0);
}

function getTotalPickedQuantity() {
    if (state.lines && state.lines.length) {
        return state.lines.reduce((sum, line) => sum + getLinePickedQuantity(line), 0);
    }
    return Number(state.picking?.picked_quantity || 0);
}

function getLinePickedQuantity(line) {
    if (line.allocations && line.allocations.length) {
        return line.allocations.reduce((sum, allocation) => sum + getAllocationPickedQuantity(allocation), 0);
    }
    return Number(line.picked_quantity || 0);
}

function getAllocationPickedQuantity(allocation) {
    const fromApi = Number(allocation.picked_quantity || 0);
    if (fromApi > 0) return fromApi;
    const records = state.picking?.records || [];
    return records
        .filter((record) =>
            record
            && record.status === 'picked'
            && String(record.lot_number || '') === String(allocation.lot_number || '')
            && (!allocation.product_id || !record.product_id || Number(record.product_id) === Number(allocation.product_id))
        )
        .reduce((sum, record) => sum + Number(record.picked_quantity || 0), 0);
}

function getQuantityReadiness() {
    const lines = state.lines || [];
    if (!lines.length) {
        return { ready: false, summary: '品目明細がありません。' };
    }
    const incomplete = lines.filter((line) => {
        const required = Number(line.quantity || 0);
        const allocated = Number(line.allocated_quantity || line.shipped_quantity || 0);
        return required <= 0 || allocated < required;
    });
    const total = lines.reduce((sum, line) => sum + Number(line.quantity || 0), 0);
    const allocated = lines.reduce((sum, line) => sum + Number(line.allocated_quantity || line.shipped_quantity || 0), 0);
    return {
        ready: incomplete.length === 0,
        summary: `品目 ${lines.length - incomplete.length}/${lines.length} 件、ロット引当 ${allocated}/${total}`,
        incomplete
    };
}

function getActiveAllocations() {
    const fromLines = (state.lines || []).flatMap(line => line.allocations || []);
    return fromLines.length ? fromLines : (state.allocations || []);
}

function renderScanTargets() {
    const box = document.getElementById('scanTargets');
    if (!box) return;
    const allocations = getActiveAllocations();
    if (!allocations.length) {
        box.innerHTML = '';
        return;
    }
    box.innerHTML = allocations.map(a => {
        const picked = Number(a.picked_quantity || 0);
        const required = Number(a.shipped_quantity || 0);
        const remaining = Math.max(0, required - picked);
        return `
            <div class="col-sm-6">
                <button type="button" class="btn btn-outline-primary w-100 scan-target-button" data-scan-lot="${escapeHtml(a.lot_number)}" ${remaining <= 0 ? 'disabled' : ''}>
                    <div class="fw-semibold">${escapeHtml(a.product_code || '')} ${escapeHtml(a.product_name || '')}</div>
                    <div class="small">ロット ${escapeHtml(a.lot_number)} / 残 ${remaining}</div>
                </button>
            </div>`;
    }).join('');
    box.querySelectorAll('[data-scan-lot]').forEach((button) => {
        button.addEventListener('click', () => {
            document.getElementById('scanInput').value = button.getAttribute('data-scan-lot') || '';
            document.getElementById('scanQty').value = 1;
            document.getElementById('scanQty').focus();
        });
    });
}

function renderAllocationProgress() {
    const allocations = getActiveAllocations();
    if (!allocations.length) {
        return '<div class="text-muted small">既存単一品目データ互換モード: 製品ロットをスキャンしてください。</div>';
    }
    return allocations.map(a => {
        const picked = Number(a.picked_quantity || 0);
        const required = Number(a.shipped_quantity || 0);
        const done = required > 0 && picked >= required;
        return `
            <div class="allocation-row ${done ? 'done' : ''}">
                <div>
                    <div class="fw-semibold">${escapeHtml(a.product_code || '')} ${escapeHtml(a.product_name || '')}</div>
                    <div class="meta">ロット ${escapeHtml(a.lot_number)} / ${escapeHtml(a.location || '-')}</div>
                </div>
                <div class="text-end">
                    <div class="fw-bold">${picked}/${required}</div>
                    <div class="meta">残 ${Math.max(0, required - picked)}</div>
                </div>
            </div>`;
    }).join('');
}

function renderCompletionSummary(completion) {
    const required = Number(completion.total_required_quantity || 0);
    const picked = Number(completion.total_picked_quantity || 0);
    const pct = required > 0 ? Math.min(100, Math.round(picked / required * 100)) : 0;
    return `
        <div class="mb-2">
            <div class="d-flex justify-content-between small text-muted">
                <span>出荷完了判定</span>
                <span>${picked}/${required}</span>
            </div>
            <div class="progress mt-1" style="height:8px">
                <div class="progress-bar bg-success" style="width:${pct}%"></div>
            </div>
        </div>`;
}

function notify(message, type) {
    if (typeof window.showToast === 'function') {
        window.showToast(message, type);
    } else {
        alert(message);
    }
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
}
</script>
</body>
</html>
