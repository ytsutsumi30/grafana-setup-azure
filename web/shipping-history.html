<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出荷履歴 - 出荷検品システム</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link href="css/tokens.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <script src="js/m365-auth.js?v=202607070030"></script>
</head>
<body data-page="shipping-history" data-layout="auto">
  <main class="container-fluid px-3 pb-4">
    <section class="app-card card">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-lg-5">
            <label for="historySearch" class="form-label">出荷指示番号 / 顧客名</label>
            <input id="historySearch" class="form-control" type="search" placeholder="例: SHIP / 顧客名">
          </div>
          <div class="col-8 col-lg-4">
            <label for="historyStatus" class="form-label">ステータス</label>
            <select id="historyStatus" class="form-select">
              <option value="shipped,delivered">出荷済 / 配達済</option>
              <option value="inspecting">検品中</option>
              <option value="packing">梱包中</option>
              <option value="picking">ピッキング中</option>
              <option value="pending">未着手</option>
              <option value="pending,picking,packing,inspecting,shipped,delivered,processing">すべて</option>
            </select>
          </div>
          <div class="col-4 col-lg-3 d-grid">
            <button id="historySearchButton" class="btn btn-primary" type="button">
              <i class="fas fa-search me-1"></i>検索
            </button>
          </div>
        </div>
      </div>
    </section>

    <div class="row g-3">
      <section class="col-12 col-xl-4">
        <div class="app-card card h-100">
          <div class="card-header bg-white d-flex align-items-center justify-content-between">
            <h2 class="h6 mb-0"><i class="fas fa-list me-1"></i>出荷指示</h2>
            <button id="historyRefreshButton" class="btn btn-outline-secondary btn-sm" type="button" title="更新">
              <i class="fas fa-rotate"></i>
            </button>
          </div>
          <div class="list-group list-group-flush" id="historyList">
            <div class="text-muted small p-3">検索条件を指定してください</div>
          </div>
        </div>
      </section>

      <section class="col-12 col-xl-8">
        <div id="historyEmpty" class="app-card card">
          <div class="card-body text-center py-5 text-muted">
            <i class="fas fa-clipboard-list fa-2x mb-3"></i>
            <div>出荷指示を選択すると、品目別、ロット別、QR/スキャン単位、監査ログを表示します。</div>
          </div>
        </div>

        <div id="historyDetail" class="d-none">
          <section class="app-card card">
            <div class="card-body">
              <div class="d-flex flex-wrap gap-2 justify-content-between align-items-start">
                <div>
                  <h2 class="h5 mb-1" id="detailInstructionId"></h2>
                  <div class="text-muted small" id="detailMeta"></div>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                  <span id="detailStatus" class="status-badge"></span>
                  <a id="detailPpsLink" class="btn btn-outline-primary btn-sm" href="#">
                    <i class="fas fa-boxes-stacked me-1"></i>PPS
                  </a>
                  <a id="detailInspectionReportLink" class="btn btn-outline-success btn-sm" href="#">
                    <i class="fas fa-file-lines me-1"></i>検品結果票
                  </a>
                  <a id="detailLotReportLink" class="btn btn-outline-success btn-sm" href="#">
                    <i class="fas fa-table-list me-1"></i>ロット実績票
                  </a>
                </div>
              </div>
              <div class="row g-2 mt-3" id="detailKpis"></div>
            </div>
          </section>

          <ul class="nav nav-tabs mb-3" id="historyTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="items-tab" data-bs-toggle="tab" data-bs-target="#itemsPane" type="button" role="tab">品目</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="lots-tab" data-bs-toggle="tab" data-bs-target="#lotsPane" type="button" role="tab">ロット</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="scans-tab" data-bs-toggle="tab" data-bs-target="#scansPane" type="button" role="tab">QR/スキャン</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="corrections-tab" data-bs-toggle="tab" data-bs-target="#correctionsPane" type="button" role="tab">取消/修正</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="audit-tab" data-bs-toggle="tab" data-bs-target="#auditPane" type="button" role="tab">監査ログ</button>
            </li>
          </ul>

          <div class="tab-content">
            <div class="tab-pane fade show active" id="itemsPane" role="tabpanel" tabindex="0">
              <div id="itemsContent"></div>
            </div>
            <div class="tab-pane fade" id="lotsPane" role="tabpanel" tabindex="0">
              <div id="lotsContent"></div>
            </div>
            <div class="tab-pane fade" id="scansPane" role="tabpanel" tabindex="0">
              <div id="scansContent"></div>
            </div>
            <div class="tab-pane fade" id="correctionsPane" role="tabpanel" tabindex="0">
              <div id="correctionsContent"></div>
            </div>
            <div class="tab-pane fade" id="auditPane" role="tabpanel" tabindex="0">
              <div id="auditContent"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/shipping-history.js?v=2026071001"></script>
</body>
</html>
