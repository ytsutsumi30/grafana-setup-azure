<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出荷指示管理</title>

    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="css/tokens.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
    <link href="css/pages/shipping-instructions.css?v=2026071001" rel="stylesheet">
    <script src="js/m365-auth.js?v=202607070030"></script>
</head>
<body data-page="shipping-instructions">
    <!-- ローディングオーバーレイ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- ページヘッダー -->
    <div class="page-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col">
                    <h1><i class="fas fa-truck-loading me-2"></i>出荷指示管理</h1>
                    <p class="mb-0">顧客への出荷指示管理</p>
                </div>
                <div class="col-auto">
                    <a href="maintenance.html" class="btn btn-light btn-lg">
                        <i class="fas fa-arrow-left me-2"></i>メンテナンスメニューに戻る
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container mb-5">
        <!-- アクションボタン -->
        <div class="row mb-4">
            <div class="col">
                <button id="createInstructionButton" class="btn btn-danger btn-lg" type="button">
                    <i class="fas fa-plus-circle me-2"></i>新規出荷指示登録
                </button>
                <button id="refreshInstructionsButton" class="btn btn-outline-secondary btn-lg ms-2" type="button">
                    <i class="fas fa-sync-alt me-2"></i>更新
                </button>
            </div>
        </div>

        <!-- 出荷指示一覧テーブル -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>出荷指示一覧</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>指示ID</th>
                                <th>製品</th>
                                <th>数量</th>
                                <th>出荷日</th>
                                <th>顧客名</th>
                                <th>優先度</th>
                                <th>ステータス</th>
                                <th>監査注意</th>
                                <th>出荷進捗</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="instructionsTableBody">
                            <tr>
                                <td colspan="10" class="text-center text-muted py-5">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3">データを読み込んでいます...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 出荷指示登録・編集モーダル -->
    <div class="modal fade" id="instructionModal" tabindex="-1" aria-labelledby="instructionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="instructionModalLabel">
                        <i class="fas fa-truck-loading me-2"></i><span id="modalTitle">新規出荷指示登録</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="instructionForm">
                        <input type="hidden" id="instructionDbId">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="instructionId" class="form-label required-field">出荷指示ID</label>
                                <input type="text" class="form-control" id="instructionId" maxlength="50" required>
                                <div class="invalid-feedback">出荷指示IDを入力してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="productId" class="form-label required-field">製品</label>
                                <select class="form-select" id="productId" required>
                                    <option value="">製品を選択してください</option>
                                </select>
                                <div class="invalid-feedback">製品を選択してください</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="quantity" class="form-label required-field">数量</label>
                                <input type="number" class="form-control" id="quantity" min="1" step="1" required>
                                <div class="invalid-feedback">1以上の数量を入力してください</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="shippingDate" class="form-label">出荷日</label>
                                <input type="date" class="form-control" id="shippingDate">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="customerName" class="form-label">顧客名</label>
                                <input type="text" class="form-control" id="customerName" maxlength="255">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="shippingLocationId" class="form-label">出荷元拠点</label>
                                <select class="form-select" id="shippingLocationId">
                                    <option value="">選択してください</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="deliveryLocationId" class="form-label">配送先拠点</label>
                                <select class="form-select" id="deliveryLocationId">
                                    <option value="">選択してください</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="priority" class="form-label">優先度</label>
                                <select class="form-select" id="priority">
                                    <option value="normal">通常</option>
                                    <option value="high">高</option>
                                    <option value="low">低</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="status" class="form-label">ステータス</label>
                                <select class="form-select" id="status">
                                    <option value="pending">未処理</option>
                                    <option value="processing">処理中</option>
                                    <option value="shipped">出荷済</option>
                                    <option value="delivered">配送完了</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="trackingNumber" class="form-label">トラッキング番号</label>
                                <input type="text" class="form-control" id="trackingNumber" maxlength="100">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label">備考</label>
                            <textarea class="form-control" id="notes" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <button id="saveInstructionButton" type="button" class="btn btn-danger">
                        <i class="fas fa-save me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>

    <script src="js/pages/shipping-instructions.js?v=2026071001"></script>
</body>
</html>
