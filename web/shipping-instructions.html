<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出荷指示管理</title>

    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="css/tokens.css?v=2026080104" rel="stylesheet">
    <link href="css/components.css?v=2026080104" rel="stylesheet">
    <link href="css/pages/shipping-instructions.css?v=2026080104" rel="stylesheet">
    <script src="js/m365-auth.js?v=202607070030"></script>
</head>
<body data-page="shipping-instructions" data-layout="auto">
    <!-- ローディングオーバーレイ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light shipping-loading-spinner" role="status">
            <span class="visually-hidden">読み込み中</span>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <main class="container-fluid px-3 pb-4">
        <section class="app-card card shipping-toolbar" aria-labelledby="shippingQueueTitle">
            <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h2 id="shippingQueueTitle" class="h6 mb-1"><i class="fas fa-list-check me-2"></i>出荷指示キュー</h2>
                    <p id="shippingSummary" class="small text-muted mb-0" aria-live="polite">出荷指示を読み込んでいます。</p>
                </div>
                <div class="shipping-toolbar-actions">
                    <button id="refreshInstructionsButton" class="btn btn-outline-secondary" type="button">
                        <i class="fas fa-sync-alt me-1"></i>更新
                    </button>
                    <button id="createInstructionButton" class="btn btn-primary" type="button">
                        <i class="fas fa-plus me-1"></i>手入力で追加
                    </button>
                </div>
            </div>
        </section>

        <!-- 出荷指示一覧テーブル -->
        <section class="app-card card shipping-list-panel">
            <div class="card-header bg-white">
                <h3 class="h6 mb-0"><i class="fas fa-truck-fast me-2"></i>出荷指示一覧</h3>
            </div>
            <div class="card-body p-0 d-none d-lg-block">
                <div class="table-responsive shipping-table-wrap">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>出荷指示</th>
                                <th>顧客・出荷日</th>
                                <th>代表品目・数量</th>
                                <th>優先度・状態</th>
                                <th>監査注意</th>
                                <th>出荷進捗</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="instructionsTableBody">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-5">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3">データを読み込んでいます...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div id="instructionsMobileList" class="shipping-mobile-list d-lg-none">
                <div class="text-muted text-center p-4">データを読み込んでいます...</div>
            </div>
        </section>
    </main>

    <!-- 出荷指示登録・編集モーダル -->
    <div class="modal fade" id="instructionModal" tabindex="-1" aria-labelledby="instructionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="instructionModalLabel">
                        <i class="fas fa-truck-loading me-2"></i><span id="modalTitle">新規出荷指示登録</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="閉じる"></button>
                </div>
                <div class="modal-body">
                    <form id="instructionForm">
                        <input type="hidden" id="instructionDbId">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="instructionId" class="form-label required-field">出荷指示ID</label>
                                <input type="text" class="form-control" id="instructionId" maxlength="50" required>
                                <div class="invalid-feedback">出荷指示IDを入力してください</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="productId" class="form-label required-field">製品</label>
                                <select class="form-select" id="productId" required>
                                    <option value="">製品を選択してください</option>
                                </select>
                                <div class="invalid-feedback">製品を選択してください</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="quantity" class="form-label required-field">数量</label>
                                <input type="number" class="form-control" id="quantity" min="1" step="1" required>
                                <div class="invalid-feedback">1以上の数量を入力してください</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="shippingDate" class="form-label">出荷日</label>
                                <input type="date" class="form-control" id="shippingDate">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="customerName" class="form-label">顧客名</label>
                                <input type="text" class="form-control" id="customerName" maxlength="255">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="shippingLocationId" class="form-label">出荷元拠点</label>
                                <select class="form-select" id="shippingLocationId">
                                    <option value="">選択してください</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="deliveryLocationId" class="form-label">配送先拠点</label>
                                <select class="form-select" id="deliveryLocationId">
                                    <option value="">選択してください</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="priority" class="form-label">優先度</label>
                                <select class="form-select" id="priority">
                                    <option value="normal">通常</option>
                                    <option value="high">高</option>
                                    <option value="low">低</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="status" class="form-label">ステータス</label>
                                <input type="hidden" id="status" value="pending">
                                <div id="statusDisplay" class="shipping-status-readonly" role="status">未処理</div>
                                <div class="form-text">状態は出荷数入力、PPS、QR検品、出荷完了の各操作から更新されます。</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="trackingNumber" class="form-label">トラッキング番号</label>
                                <input type="text" class="form-control" id="trackingNumber" maxlength="100">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label">備考</label>
                            <textarea class="form-control" id="notes" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>キャンセル
                    </button>
                    <button id="saveInstructionButton" type="button" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js?v=2026080104"></script>

    <script src="js/pages/shipping-instructions.js?v=2026080104"></script>
</body>
</html>
