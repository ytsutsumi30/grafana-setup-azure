services:
  postgres:
    build:
      context: ./postgres
    image: shipping-inspection-postgres-local
    container_name: shipping-inspection-postgres
    environment:
      POSTGRES_DB: production_db
      POSTGRES_USER: production_user
      POSTGRES_PASSWORD: production_pass
      TZ: Asia/Tokyo
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U production_user -d production_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: production_pass
    volumes:
      - ./postgres/migrations/20260718_inventory_ledger_integrity.sql:/migration.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - psql -h postgres -U production_user -d production_db -v ON_ERROR_STOP=1 -1 -f /migration.sql
    restart: "no"

  api:
    build:
      context: ./api
    container_name: shipping-inspection-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: production_db
      DB_USER: production_user
      DB_PASSWORD: production_pass
      DB_SSL: "false"
      M365_AUTH_ENABLED: "false"
      M365_AUTH_REQUIRED: "false"
      M365_AUTH_TENANT_ID: ""
      M365_AUTH_CLIENT_ID: ""
      M365_AUTH_SCOPES: "User.Read"
      M365_AUTH_ALLOWED_DOMAINS: ""
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-1000}"
      # セキュリティ運用フラグ(既定は POC 維持)
      WRITE_AUTH_MODE: "${WRITE_AUTH_MODE:-off}"       # off | warn | enforce
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:-}"          # 危険EP/enforce時の管理者トークン
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}" # 空=クロスオリジン拒否
      # --- 自前 OIDC (案C) SSO。既定は無効(ローカルは無認証で動作) ---
      AUTH_WALL: "${AUTH_WALL:-off}"                    # on でSSOウォール有効
      SESSION_SECRET: "${SESSION_SECRET:-}"             # セッション署名鍵(本番必須)
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"           # 例 https://<web公開URL>
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_ALLOWED_DOMAINS: "${GOOGLE_ALLOWED_DOMAINS:-}" # 空=Google任意許可
      MS_CLIENT_ID: "${MS_CLIENT_ID:-}"
      MS_CLIENT_SECRET: "${MS_CLIENT_SECRET:-}"
      MS_TENANT_ID: "${MS_TENANT_ID:-}"                 # 社内テナントID(common も可)
      TZ: Asia/Tokyo
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3002:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
    container_name: shipping-inspection-web
    environment:
      API_UPSTREAM: http://api:3001
      GRAFANA_UPSTREAM: http://grafana:3000
      TZ: Asia/Tokyo
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss:latest
    container_name: shipping-inspection-grafana
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SERVER_ROOT_URL: "http://localhost:8080/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      TZ: Asia/Tokyo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3003:3000"

volumes:
  postgres-data:
