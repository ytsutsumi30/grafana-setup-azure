services:
  postgres:
    build:
      context: ./postgres
    image: shipping-inspection-postgres-local
    container_name: shipping-inspection-postgres
    environment:
      POSTGRES_DB: production_db
      POSTGRES_USER: production_user
      POSTGRES_PASSWORD: production_pass
      TZ: Asia/Tokyo
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U production_user -d production_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: shipping-inspection-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: production_db
      DB_USER: production_user
      DB_PASSWORD: production_pass
      DB_SSL: "false"
      M365_AUTH_ENABLED: "false"
      M365_AUTH_REQUIRED: "false"
      M365_AUTH_TENANT_ID: ""
      M365_AUTH_CLIENT_ID: ""
      M365_AUTH_SCOPES: "User.Read"
      M365_AUTH_ALLOWED_DOMAINS: ""
      # セキュリティ運用フラグ(既定は POC 維持)
      WRITE_AUTH_MODE: "${WRITE_AUTH_MODE:-off}"       # off | warn | enforce
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:-}"          # 危険EP/enforce時の管理者トークン
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}" # 空=クロスオリジン拒否
      EASY_AUTH_MODE: "${EASY_AUTH_MODE:-off}"         # off | allowlist (ACA Easy Auth 連携)
      GOOGLE_ALLOWED_DOMAINS: "${GOOGLE_ALLOWED_DOMAINS:-}" # 空=Google任意許可
      TZ: Asia/Tokyo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
    container_name: shipping-inspection-web
    environment:
      API_UPSTREAM: http://api:3001
      TZ: Asia/Tokyo
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

